  function ligar() {
    const pintar = () => {
      const el = document.getElementById('relatorio');
      el.innerHTML = st.aba === 'semanal' ? semanal() : st.aba === 'executivo' ? executivo() : diretoria();
      Chart.ligarTooltips(el);
      // filtros por clique nas barras
      el.querySelectorAll('[data-f]').forEach(r => r.addEventListener('click', () => {
        const [k, v] = r.dataset.f.split('|');
        st.fx[k] = st.fx[k] === v ? '' : v;
        pintar();
      }));
      el.querySelectorAll('[data-limpa]').forEach(bt => bt.addEventListener('click', () => {
        const k = bt.dataset.limpa;
        if (k === '__todos') st.fx = { local: '', grupo: '', mecanico: '', tipo: '' }; else st.fx[k] = '';
        pintar();
      }));
      el.querySelectorAll('[data-veic]').forEach(tr => tr.addEventListener('click', () => App.irPara('veiculo/' + tr.dataset.veic)));
      const bx = document.getElementById('exp-baixar');
      if (bx) bx.addEventListener('click', () => Exportar.baixar(st.de, st.ate));
      const bc = document.getElementById('exp-compartilhar');
      if (bc) bc.addEventListener('click', () => Exportar.compartilhar(st.de, st.ate));
      const bp = document.getElementById('exp-copiar');
      if (bp) bp.addEventListener('click', () => Exportar.copiarResumo(st.de, st.ate));
    };
    document.querySelectorAll('[data-aba]').forEach(b => b.addEventListener('click', () => {
      st.aba = b.dataset.aba;
      if (st.aba !== 'diretoria') st.fx = { local: '', grupo: '', mecanico: '', tipo: '' };
      document.querySelectorAll('[data-aba]').forEach(x => x.classList.toggle('on', x.dataset.aba === st.aba));
      pintar();
    }));
    const de = document.getElementById('r-de'), ate = document.getElementById('r-ate');
    de.addEventListener('change', e => { st.de = e.target.value; pintar(); });
    ate.addEventListener('change', e => { st.ate = e.target.value; pintar(); });
    const mover = n => { st.de = Dt.add(st.de, n * 7); st.ate = Dt.add(st.ate, n * 7); de.value = st.de; ate.value = st.ate; pintar(); };
    document.getElementById('sem-ant').addEventListener('click', () => mover(-1));
    document.getElementById('sem-prox').addEventListener('click', () => mover(1));
    document.getElementById('ir-ultima').addEventListener('click', () => {
      const hoje = Dt.today();
      const datas = DB.get().ordens.map(o => o.data).filter(d => d && d <= hoje).sort();
      if (!datas.length) return;
      st.de = Dt.weekStart(datas[datas.length - 1]); st.ate = Dt.add(st.de, 6);
      de.value = st.de; ate.value = st.ate; pintar();
    });
    document.getElementById('btn-print').addEventListener('click', () => window.print());
    pintar();
  }
  return { pagina };
})();


/* ============================================================
   IMPORTAÇÃO DA PLANILHA — lê o .xlsx direto no navegador
   (ZIP + inflate nativo, sem bibliotecas externas)
   ============================================================ */
const Importar = (() => {

  /* ---------- ZIP ---------- */
  function lerDiretorio(buf) {
    const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    let eocd = -1;
    for (let i = buf.length - 22; i >= Math.max(0, buf.length - 66000); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('Arquivo .xlsx inválido (diretório do ZIP não encontrado).');
    const n = dv.getUint16(eocd + 10, true), ini = dv.getUint32(eocd + 16, true);
    const itens = {}; let p = ini;
    for (let k = 0; k < n; k++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const metodo = dv.getUint16(p + 10, true), tam = dv.getUint32(p + 20, true);
      const fnLen = dv.getUint16(p + 28, true), exLen = dv.getUint16(p + 30, true), cmLen = dv.getUint16(p + 32, true);
      const off = dv.getUint32(p + 42, true);
      const nome = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + fnLen));
      itens[nome] = { metodo, tam, off };
      p += 46 + fnLen + exLen + cmLen;
    }
    return { dv, itens };
  }
  async function extrair(buf, dir, nome) {
    const it = dir.itens[nome]; if (!it) return null;
    const dv = dir.dv;
    if (dv.getUint32(it.off, true) !== 0x04034b50) throw new Error('Entrada corrompida: ' + nome);
    const fnLen = dv.getUint16(it.off + 26, true), exLen = dv.getUint16(it.off + 28, true);
    const ini = it.off + 30 + fnLen + exLen;
    const dados = buf.subarray(ini, ini + it.tam);
    if (it.metodo === 0) return new TextDecoder().decode(dados);
    if (typeof DecompressionStream === 'undefined')
      throw new Error('Este navegador não descompacta .xlsx. Use o Chrome ou Edge atualizado.');
    const st = new Blob([dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new TextDecoder().decode(await new Response(st).arrayBuffer());
  }

  /* ---------- XML → grade de células ---------- */
  const col2i = ref => { let n = 0; for (const c of ref.replace(/\d+/g, '')) n = n * 26 + (c.charCodeAt(0) - 64); return n - 1; };
  const serial2iso = s => {
    const ms = Math.round((s - 25569) * 86400000);
    const d = new Date(ms);
    return isNaN(d) ? null : d.toISOString().slice(0, 10);
  };

  function estilosData(xmlEstilos) {
    const fmtData = new Set([14, 15, 16, 17, 18, 19, 20, 21, 22, 45, 46, 47]);
    const saida = new Set();
    if (!xmlEstilos) return saida;
    const doc = new DOMParser().parseFromString(xmlEstilos, 'text/xml');
    doc.querySelectorAll('numFmt').forEach(f => {
      const c = f.getAttribute('formatCode') || '';
      if (/[dmy]/i.test(c) && !/[#0]/.test(c.replace(/\[[^\]]*\]/g, ''))) fmtData.add(+f.getAttribute('numFmtId'));
    });
    const xfs = doc.querySelector('cellXfs');
    if (xfs) [...xfs.querySelectorAll('xf')].forEach((xf, i) => {
      if (fmtData.has(+(xf.getAttribute('numFmtId') || 0))) saida.add(i);
    });
    return saida;
  }

  function lerAba(xml, compart, estData) {
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    const linhas = [];
    doc.querySelectorAll('row').forEach(r => {
      const ri = +r.getAttribute('r') - 1;
      const arr = linhas[ri] = linhas[ri] || [];
      r.querySelectorAll('c').forEach(c => {
        const ref = c.getAttribute('r') || '', t = c.getAttribute('t'), s = c.getAttribute('s');
        const vEl = c.querySelector('v'), isEl = c.querySelector('is t');
        let val = null;
        if (t === 's' && vEl) val = compart[+vEl.textContent] || '';
        else if (t === 'inlineStr' && isEl) val = isEl.textContent;
        else if (t === 'str' && vEl) val = vEl.textContent;
        else if (vEl) {
          const n = parseFloat(vEl.textContent);
          val = isNaN(n) ? vEl.textContent : (estData.has(+s) && n > 20000 && n < 140000 ? { data: serial2iso(n) } : n);
        }
        if (val !== null && val !== '') arr[col2i(ref)] = val;
      });
    });
    return linhas;
  }

  /* ---------- interpretação dos blocos ---------- */
  const txt = v => v == null ? '' : (typeof v === 'object' ? (v.data || '') : String(v)).trim();
  const numero = v => { if (typeof v === 'number') return v; const n = parseFloat(String(v).replace(/[^\d.,-]/g, '').replace(',', '.')); return isNaN(n) ? null : n; };
  const semAcento = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const ehData = v => v && typeof v === 'object' && v.data;
  function dataDe(v) {
    if (ehData(v)) { const d = v.data; return d.slice(0, 4) === '2026' ? d : '2026' + d.slice(4); }
    const s = txt(v);
    let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if (m) { let y = +m[3]; if (y < 100) y += 2000; if (y < 1000) y = 2000 + (y % 100); if (y !== 2026) y = 2026;
      return `${y}-${String(+m[2]).padStart(2, '0')}-${String(+m[1]).padStart(2, '0')}`; }
    m = s.match(/^(\d{2})(\d{2})\/(\d{4})$/);
    if (m) return `${m[3]}-${m[2]}-${m[1]}`;
    return null;
  }
  const PLACA = /(?:^|[^A-Z0-9])([A-Z]{3}[\s\-]?\d[A-Z0-9]\d{2})(?![A-Z0-9])/;
  const ALIAS = { RFS6Q67: 'RFS6G67', NPJ6497: 'NPJ6E97', PRJ4I56: 'OOM9H19', QCW2843: 'QCW2913', PRD1C833: 'PRD1C83', QBE0B97: 'QBE0C97' };
  function achaPlaca(t) {
    const m = String(t).toUpperCase().match(PLACA);
    if (!m) return null;
    const p = m[1].replace(/[\s\-]/g, '');
    return ALIAS[p] || p;
  }

  function interpretar(abas) {
    const servicos = [], ordens = [], veiculosNovos = [];
    const b = DB.get();
    const idxServ = new Set(b.servicos.map(s => semAcento(s.descricao) + '|' + s.valor));
    const assinaturas = new Set();
    b.ordens.forEach(o => o.itens.forEach(i =>
      assinaturas.add([o.veiculoId, o.data, semAcento(i.descricao), i.total].join('|'))));

    for (const [nome, linhas] of Object.entries(abas)) {
      const n = semAcento(nome);

      /* tabela de preços */
      if (n.startsWith('valor')) {
        const cats = {};
        linhas.forEach((row, ri) => {
          if (!row) return;
          row.forEach((cel, ci) => {
            if (typeof cel !== 'string') return;
            if (/^valor/.test(semAcento(cel)) && row[ci - 1]) cats[ci - 1] = txt(row[ci - 1]);
          });
        });
        linhas.forEach(row => {
          if (!row) return;
          for (let ci = 0; ci < row.length; ci++) {
            const d = txt(row[ci]), v = numero(row[ci + 1]);
            if (!d || d.length < 6 || v == null || v <= 0) continue;
            if (/^valor|^espelho|^total/i.test(semAcento(d))) continue;
            const chave = semAcento(d) + '|' + v;
            if (idxServ.has(chave)) continue;
            idxServ.add(chave);
            servicos.push({ descricao: d, valor: v, categoria: cats[ci] || 'Importado', status: 'Ativo', origem: 'planilha' });
          }
        });
        continue;
      }
      /* Blocos de lançamento. Dois formatos convivem na planilha:
         A) Data | KM | Serviço | Valor          (Mecanica, Posto de mola, Ser.ar cond.)
         B) Veículo | KM | Serviço | NF/Mecânico | Valor   (OP.F., sem coluna de data)
         As abas de resumo semanal não têm cabeçalho "Data" nem "Valor/NF" e são ignoradas. */
      const cabecalhos = [];
      linhas.forEach((row, ri) => {
        if (!row) return;
        row.forEach((cel, ci) => {
          const t = semAcento(txt(cel)).replace(/[^a-z]/g, '');
          if (t === 'data' && txt(row[ci + 2])) { cabecalhos.push({ ri, ci, veic: txt(row[ci + 2]), fmt: 'A' }); return; }
          if (t.startsWith('valor') && semAcento(txt(row[ci - 1])).startsWith('nf')) {
            const titulo = [row[ci - 4], row[ci - 3], row[ci - 2]].map(txt)
              .filter(t => t && !/^(quilom|km|nf|valor|data)/i.test(semAcento(t))).join(' ');
            if (titulo) cabecalhos.push({ ri, ci: ci - 4, colValor: ci, colMec: ci - 1, veic: titulo, fmt: 'B' });
          }
        });
      });
      const linhasCab = [...new Set(cabecalhos.map(c => c.ri))].sort((a, c) => a - c);

      cabecalhos.forEach(cab => {
        const prox = linhasCab.find(r => r > cab.ri);
        const fim = prox ? prox - 1 : linhas.length;
        const placa = achaPlaca(cab.veic);
        let v = placa ? b.veiculos.find(x => x.placa === placa) : null;
        if (!v) v = b.veiculos.find(x => semAcento(x.descricao || x.nome) === semAcento(cab.veic));
        if (!v) { const alvo = semAcento(cab.veic).replace(/[^a-z0-9]/g, '');
          v = b.veiculos.find(x => { const c = semAcento(x.descricao || x.nome).replace(/[^a-z0-9]/g, ''); return c.length > 6 && (c === alvo || alvo.includes(c)); }); }
        if (!v) {   // casa pelo código do veículo/frota embutido no título (ex.: FM06H82, 11203.12, F077)
          const cods = (cab.veic.toUpperCase().match(/\b[A-Z0-9][A-Z0-9.]{4,}\b/g) || [])
            .filter(t => /[A-Z]/.test(t) && /\d/.test(t));
          for (const cod of cods) {
            v = b.veiculos.find(x => (x.descricao || '').toUpperCase().includes(cod));
            if (v) break;
          }
        }
        if (!v) {
          v = {
            id: placa || 'IMP-' + semAcento(cab.veic).replace(/[^a-z0-9]+/g, '-').slice(0, 22).toUpperCase(),
            placa: placa || '—', frota: '—', nome: cab.veic.replace(PLACA, '').trim() || cab.veic,
            tipo: 'Outros', unidade: 'KM', marca: '', modelo: '', condutor: '', local: '',
            descricao: cab.veic, status: 'Ativo', kmAtual: null, origem: 'planilha'
          };
          if (!veiculosNovos.find(x => x.id === v.id)) veiculosNovos.push(v);
        }
        const setor = n.includes('mola') ? 'Posto de Mola' : /\bar\b|ar cond/.test(n) ? 'Ar Condicionado'
          : cab.fmt === 'B' ? 'Operação Florestal' : 'Mecânica';
        const mecPadrao = setor === 'Posto de Mola' ? 'Vandame' : setor === 'Ar Condicionado' ? 'Equipe Ar Condicionado' : 'Jeferson';
        let data = null, km = null;
        const porData = new Map();   // uma OS por data dentro do bloco
        for (let r = cab.ri + 1; r <= fim; r++) {
          const row = linhas[r]; if (!row) continue;
          if (cab.fmt === 'A') {
            const d = dataDe(row[cab.ci]);
            if (d) data = d;
            const k = numero(row[cab.ci + 1]);
            if (k != null && k > 0) km = k;
          }
          const desc = txt(row[cab.ci + 2]);
          const val = numero(row[cab.fmt === 'B' ? cab.colValor : cab.ci + 3]);
          if (!desc || val == null) continue;
          if (/^total|^valor|^nf/.test(semAcento(desc))) continue;
          let qtd = 1, dd = desc;
          const mq = desc.match(/^\s*(\d{1,2})\s*[xX]?\s*(?=[A-Za-zÀ-ÿ])/);
          if (mq && +mq[1] <= 12) { qtd = +mq[1]; dd = desc.slice(mq[0].length).trim() || desc; }
          const sig = [v.id, data, semAcento(dd), val].join('|');
          if (assinaturas.has(sig)) continue;
          assinaturas.add(sig);
          const chave = data || 'sem-data';
          let atual = porData.get(chave);
          if (!atual) {
            let mec = mecPadrao;
            if (cab.fmt === 'B') { const t = txt(row[cab.colMec]); if (/vandame/i.test(t)) mec = 'Vandame'; }
            atual = {
              id: '', numero: 0, data, veiculoId: v.id, placa: v.placa, frota: v.frota, kmH: km,
              unidade: v.unidade, local: v.local || (setor === 'Operação Florestal' ? 'Operação Florestal' : 'Oficina'),
              condutor: v.condutor || '', mecanico: mec, setor,
              itens: [], obs: '', status: 'Concluída', total: 0, origem: 'planilha'
            };
            porData.set(chave, atual); ordens.push(atual);
          }
          atual.itens.push({ qtd, descricao: dd, valorUnit: qtd > 1 ? Math.round(val / qtd * 100) / 100 : val, total: val, servicoCod: null });
          atual.total = Math.round(atual.itens.reduce((s, i) => s + i.total, 0) * 100) / 100;
        }
      });
    }
    return { servicos, ordens: ordens.filter(o => o.itens.length), veiculosNovos };
  }

  /* ---------- fluxo ---------- */
  async function processar(file) {
    const buf = new Uint8Array(await file.arrayBuffer());
    const dir = lerDiretorio(buf);
    const wb = await extrair(buf, dir, 'xl/workbook.xml');
    if (!wb) throw new Error('Este arquivo não parece ser uma planilha Excel (.xlsx).');
    const rels = await extrair(buf, dir, 'xl/_rels/workbook.xml.rels');
    const ssXml = await extrair(buf, dir, 'xl/sharedStrings.xml');
    const stXml = await extrair(buf, dir, 'xl/styles.xml');
    const compart = [];
    if (ssXml) new DOMParser().parseFromString(ssXml, 'text/xml').querySelectorAll('si').forEach(si => {
      compart.push([...si.querySelectorAll('t')].map(t => t.textContent).join(''));
    });
    const estData = estilosData(stXml);
    const mapaRel = {};
    if (rels) new DOMParser().parseFromString(rels, 'text/xml').querySelectorAll('Relationship').forEach(r =>
      mapaRel[r.getAttribute('Id')] = r.getAttribute('Target').replace(/^\/?xl\//, ''));
    const abas = {};
    const doc = new DOMParser().parseFromString(wb, 'text/xml');
    for (const sh of doc.querySelectorAll('sheet')) {
      const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      const alvo = mapaRel[rid];
      if (!alvo) continue;
      const xml = await extrair(buf, dir, 'xl/' + alvo);
      if (xml) abas[sh.getAttribute('name')] = lerAba(xml, compart, estData);
    }
    if (!Object.keys(abas).length) throw new Error('Nenhuma aba encontrada na planilha.');
    return interpretar(abas);
  }

  function previa(res, nomeArquivo) {
    const amostra = res.ordens.slice(0, 8).map(o => ({
      d: Fmt.date(o.data), v: Fmt.esc(DB.nomeVeiculo(o.veiculoId) !== '—' ? DB.nomeVeiculo(o.veiculoId) : o.placa),
      s: Fmt.esc(o.itens.map(i => i.descricao).join(' · ')), t: Fmt.money(o.total)
    }));
    const nada = !res.ordens.length && !res.servicos.length && !res.veiculosNovos.length;
    UI.modal('Prévia da importação', `
      <p class="dim" style="margin-bottom:var(--s4)">Arquivo <strong>${Fmt.esc(nomeArquivo)}</strong> analisado.
      Nada é gravado até você confirmar. Registros já existentes na base são ignorados automaticamente.</p>
      <div class="grid kpis" style="margin-bottom:var(--s4)">
        ${UI.kpi('Ordens de serviço novas', Fmt.num(res.ordens.length))}
        ${UI.kpi('Serviços novos', Fmt.num(res.servicos.length))}
        ${UI.kpi('Veículos novos', Fmt.num(res.veiculosNovos.length))}
        ${UI.kpi('Valor das novas OS', Fmt.money0(res.ordens.reduce((s, o) => s + o.total, 0)))}
      </div>
      ${nada ? UI.vazio('Nada novo para importar', 'Todos os lançamentos desta planilha já estão na base do sistema.')
        : UI.tabela([{ t: 'Data', k: 'd' }, { t: 'Veículo', k: 'v' }, { t: 'Serviços', k: 's' }, { t: 'Total', k: 't', cls: 'ta-r' }], amostra,
          { vazioT: 'Sem novas OS', vazioM: 'A planilha trouxe apenas serviços ou veículos.' })}
      ${res.ordens.length > 8 ? `<p class="dim" style="margin-top:10px">…e mais ${res.ordens.length - 8} ordens de serviço.</p>` : ''}`,
      `<button class="btn ghost" data-fechar>Cancelar</button>
       <button class="btn" id="imp-confirmar"${nada ? ' disabled' : ''}>Confirmar importação</button>`, '840px');

    const bt = document.getElementById('imp-confirmar');
    if (bt) bt.addEventListener('click', () => {
      const b = DB.get();
      res.veiculosNovos.forEach(v => { if (!b.veiculos.find(x => x.id === v.id)) b.veiculos.push(v); });
      res.servicos.forEach(s => DB.salvarServico(s));
      res.ordens.forEach(o => { o.id = ''; DB.salvarOS(o); });
      DB.save();
      UI.fecharModal();
      UI.toast(`Importados: ${res.ordens.length} OS, ${res.servicos.length} serviços, ${res.veiculosNovos.length} veículos.`, 'ok');
      App.render();
    });
  }

  function abrir() {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.xlsx';
    inp.addEventListener('change', async () => {
      const f = inp.files[0]; if (!f) return;
      UI.toast('Lendo a planilha…', 'load');
      try { previa(await processar(f), f.name); }
      catch (e) { console.error(e); UI.toast('Não foi possível ler a planilha: ' + e.message, 'err'); }
    });
    inp.click();
  }
  return { abrir, processar };
})();


/* ============================================================
   EXPORTAÇÃO — gera um painel HTML autônomo para a diretoria
   O arquivo sai pronto para abrir em qualquer navegador, sem
   login e sem depender do sistema.
   ============================================================ */
const Exportar = (() => {

  /** Dados compactos do período, prontos para o painel exportado. */
  function coletar(de, ate) {
    const b = DB.get();
    const os = b.ordens.filter(o => o.data && o.data >= de && o.data <= ate);
    const rec = Q.reincidencias(os, b.ordens);
    const mapaRec = new Map(rec.map(r => [r.os.id, r]));
    const dias = Math.max(1, Dt.diff(ate, de) + 1);
    const antDe = Dt.add(de, -dias), antAte = Dt.add(de, -1);
    const osAnt = b.ordens.filter(o => o.data && o.data >= antDe && o.data <= antAte);

    const linhas = os.map(o => {
      const v = DB.veiculo(o.veiculoId) || {};
      const r = mapaRec.get(o.id);
      return {
        d: o.data, n: o.numero, id: o.veiculoId, vn: v.nome || '—', p: o.placa || '—', f: o.frota || '—',
        tp: v.tipo || '—', l: o.local || '—', m: o.mecanico || '—',
        k: o.kmH, u: o.unidade || 'KM', t: o.total,
        i: o.itens.map(x => ({ q: x.qtd, s: x.descricao, g: Rec.grupoDe(x.descricao).nome, t: x.total })),
        r: r ? { dias: r.anterior.dias, ant: r.anterior.os.data, an: r.anterior.os.numero, g: r.anterior.grupos.map(Rec.nomeGrupo).join(', ') } : null
      };
    }).sort((a, c) => a.d.localeCompare(c.d));

    return {
      de, ate, emitidoEm: Dt.today(), emitidoPor: Estado.usuario ? Estado.usuario.nome : 'Grupo Brilhante',
      totalAnterior: Q.soma(osAnt), osAnterior: osAnt.length, periodoAnterior: [antDe, antAte],
      janela: DB.cfg().janelaReincidencia,
      alertas: Painel.alertas(os, b.ordens).map(a => ({ nivel: a.nivel, txt: a.txt })),
      linhas
    };
  }

  /* ---------- runtime do arquivo exportado (independente do sistema) ---------- */
  const RUNTIME = String.raw`
const F = {
  _m: new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}),
  _m0: new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}),
  _n: new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0}),
  _n1: new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1}),
  m: v => F._m.format(v||0), m0: v => F._m0.format(v||0),
  n: v => F._n.format(v||0), n1: v => F._n1.format(v||0),
  dt: i => i ? i.slice(8,10)+'/'+i.slice(5,7)+'/'+i.slice(0,4) : '—',
  dts: i => i ? i.slice(8,10)+'/'+i.slice(5,7) : '—',
  e: s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  kmh: (v,u) => v==null?'—':F._n.format(v)+' '+(u==='H'?'h':'km')
};
const AZUL='#3157CE', AMBAR='#C2721A', TRILHO='#EEF2FF';
let tip;
function ligarTips(root){
  if(!tip){ tip=document.createElement('div'); tip.className='tip'; document.body.appendChild(tip); }
  root.querySelectorAll('[data-tip]').forEach(el=>{
    el.addEventListener('mousemove',e=>{
      tip.textContent=el.getAttribute('data-tip'); tip.style.opacity='1';
      const r=tip.getBoundingClientRect();
      tip.style.left=Math.min(e.clientX+14, innerWidth-r.width-10)+'px';
      tip.style.top=Math.max(e.clientY-r.height-12,8)+'px';
    });
    el.addEventListener('mouseleave',()=>{tip.style.opacity='0';});
  });
}
const corta=(t,n)=>{t=String(t||'');return t.length>n?t.slice(0,n-1)+'…':t;};
const vazio=m=>'<div class="empty"><div class="d"></div><p>'+F.e(m||'Sem dados no período.')+'</p></div>';

function barsH(items,o){o=o||{};const fmt=o.fmt||F.m0,lw=150,bh=26,gap=10,pr=76;
  if(!items.length) return vazio(o.vazio);
  const max=Math.max.apply(null,items.map(i=>i.valor).concat([1])),h=items.length*(bh+gap),w=640,bw=w-lw-pr;
  let s='<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img">';
  items.forEach((it,i)=>{const y=i*(bh+gap),L=Math.max(3,(it.valor/max)*bw),cor=it.destaque?AMBAR:AZUL;
    const clic=it.filtro!=null?' data-f="'+F.e(it.filtro)+'" data-k="'+F.e(it.chaveF||'')+'" style="cursor:pointer"':'';
    s+='<text x="0" y="'+(y+bh/2+4)+'" style="font-size:11.5px;fill:#0F172A">'+F.e(corta(it.rotulo,24))+'</text>';
    s+='<rect x="'+lw+'" y="'+(y+4)+'" width="'+bw+'" height="'+(bh-8)+'" rx="4" fill="'+TRILHO+'"/>';
    s+='<rect class="bar" x="'+lw+'" y="'+(y+4)+'" width="'+L+'" height="'+(bh-8)+'" rx="4" fill="'+cor+'"'+clic+' data-tip="'+F.e(it.tip||'')+'"></rect>';
    s+='<text x="'+w+'" y="'+(y+bh/2+4)+'" text-anchor="end" class="lv" style="font-size:11.5px">'+fmt(it.valor)+'</text>';
  });
  return s+'</svg>';
}
function barsV(items,o){o=o||{};const fmt=o.fmt||F.n;
  if(!items.length) return vazio(o.vazio);
  const w=640,h=230,pb=40,pt=24,pl=8;
  const max=Math.max.apply(null,items.map(i=>i.valor).concat([1]));
  const cw=(w-pl*2)/items.length,bw=Math.min(46,cw-10);
  let s='<svg class="chart chart-v" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img">';
  for(let g=0;g<=3;g++){const y=pt+(h-pt-pb)*g/3;s+='<line class="gl" x1="0" x2="'+w+'" y1="'+y+'" y2="'+y+'"/>';}
  items.forEach((it,i)=>{const H=Math.max(2,(it.valor/max)*(h-pt-pb)),x=pl+i*cw+(cw-bw)/2,y=h-pb-H;
    const clic=it.filtro!=null?' data-f="'+F.e(it.filtro)+'" data-k="'+F.e(it.chaveF||'')+'" style="cursor:pointer"':'';
    s+='<rect class="bar" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+H+'" rx="4" fill="'+AZUL+'"'+clic+' data-tip="'+F.e(it.tip||'')+'"/>';
    s+='<text x="'+(x+bw/2)+'" y="'+(y-7)+'" text-anchor="middle" class="lv" style="font-size:11px">'+fmt(it.valor)+'</text>';
    s+='<text x="'+(x+bw/2)+'" y="'+(h-pb+17)+'" text-anchor="middle" style="font-size:11px">'+F.e(corta(it.rotulo,12))+'</text>';
  });
  return s+'</svg>';
}
function area(pts,o){o=o||{};const fmt=o.fmt||F.m0;
  if(pts.length<2) return pts.length?barsV(pts,{fmt:fmt}):vazio(o.vazio);
  const w=640,h=240,pl=8,pr=8,pt=22,pb=36;
  const max=Math.max.apply(null,pts.map(p=>p.valor).concat([1]));
  const X=i=>pl+(w-pl-pr)*(i/(pts.length-1)), Y=v=>h-pb-(v/max)*(h-pt-pb);
  const linha=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(p.valor).toFixed(1)).join('');
  let s='<svg class="chart chart-v" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img">';
  s+='<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+AZUL+'" stop-opacity=".22"/><stop offset="100%" stop-color="'+AZUL+'" stop-opacity="0"/></linearGradient></defs>';
  for(let g=0;g<=3;g++){const y=pt+(h-pt-pb)*g/3;s+='<line class="gl" x1="0" x2="'+w+'" y1="'+y+'" y2="'+y+'"/>';}
  s+='<path d="'+linha+'L'+X(pts.length-1)+','+(h-pb)+'L'+X(0)+','+(h-pb)+'Z" fill="url(#ga)"/>';

  const passo=Math.ceil(pts.length/8);
  pts.forEach((p,i)=>{
    s+='<circle cx="'+X(i)+'" cy="'+Y(p.valor)+'" r="4" fill="#fff" stroke="'+AZUL+'" stroke-width="2"/>';

    if(i%passo===0||i===pts.length-1) s+='<text x="'+X(i)+'" y="'+(h-pb+17)+'" text-anchor="middle" style="font-size:10.5px">'+F.e(p.rotulo)+'</text>';
  });
  return s+'</svg>';
}
function semanaDe(iso){const [y,m,d]=iso.split('-').map(Number);const x=new Date(y,m-1,d);
  x.setDate(x.getDate()-((x.getDay()+6)%7));
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}

const FX = {local:'', grupo:'', mecanico:'', tipo:''};
function filtradas(){
  return D.linhas.filter(o =>
    (!FX.local || o.l===FX.local) &&
    (!FX.mecanico || o.m===FX.mecanico) &&
    (!FX.tipo || o.tp===FX.tipo) &&
    (!FX.grupo || o.i.some(x=>x.g===FX.grupo)));
}
function agrupar(os,fn){
  const m=new Map();
  os.forEach(o=>{const k=fn(o); if(!k) return;
    const e=m.get(k)||{k:k,qtd:0,valor:0,veic:new Set()}; e.qtd++; e.valor+=o.t; e.veic.add(o.p); m.set(k,e);});
  return [...m.values()].sort((a,b)=>b.valor-a.valor);
}
function porGrupo(os){
  const m=new Map();
  os.forEach(o=>o.i.forEach(x=>{const e=m.get(x.g)||{k:x.g,qtd:0,valor:0}; e.qtd+=x.q; e.valor+=x.t; m.set(x.g,e);}));
  return [...m.values()].sort((a,b)=>b.valor-a.valor);
}
const soma=os=>os.reduce((s,o)=>s+o.t,0);

function pintar(){
  const os=filtradas(), total=soma(os), filtrado=!!(FX.local||FX.grupo||FX.mecanico||FX.tipo);
  const veic=new Set(os.map(o=>o.id)), itens=os.reduce((s,o)=>s+o.i.reduce((a,x)=>a+x.q,0),0);
  const rec=os.filter(o=>o.r);
  const varia=(!filtrado&&D.totalAnterior)?((total-D.totalAnterior)/D.totalAnterior)*100:null;

  const kpi=(l,v,sub,al)=>'<div class="card kpi'+(al?' alert':'')+'"><div class="kl">'+l+'</div><div class="kv">'+v+'</div>'+(sub?'<div class="ks">'+sub+'</div>':'')+'</div>';
  let h='<div class="grid kpis">'+
    kpi('Valor total',F.m0(total), filtrado?'no recorte filtrado':'no período')+
    kpi('Ordens de serviço',F.n(os.length))+
    kpi('Veículos atendidos',F.n(veic.size))+
    kpi('Serviços executados',F.n(itens))+
    kpi('Custo médio por OS',F.m0(os.length?total/os.length:0))+
    (varia==null
      ? kpi('Reincidências',F.n(rec.length), rec.length?'voltaram pelo mesmo sistema':'nenhuma', rec.length>0)
      : kpi('Variação','<span style="color:'+(varia>0?'#B42318':'#047857')+'">'+(varia>0?'+':'')+F.n1(varia)+'%</span>','vs. '+F.dt(D.periodoAnterior[0])+' a '+F.dt(D.periodoAnterior[1])))+
    '</div>';

  if(varia!=null && rec.length) h+='<div class="card" style="padding:14px 18px;margin-top:16px"><strong>'+F.n(rec.length)+'</strong> reincidência(s) no período — veículos que voltaram pelo mesmo sistema em até '+D.janela+' dias.</div>';

  if(D.alertas.length && !filtrado){
    h+='<section class="card sec" style="margin-top:16px"><h2>⚠️ Atenção</h2><div class="alertas">'+
      D.alertas.map(a=>'<div class="al"><span class="badge '+(a.nivel==='alto'?'b-amber':'b-gray')+'">'+(a.nivel==='alto'?'Prioridade':'Observar')+'</span><span>'+a.txt+'</span></div>').join('')+
      '</div></section>';
  }

  const semanas=(()=>{const m=new Map();
    os.forEach(o=>{const k=semanaDe(o.d);const e=m.get(k)||{k:k,qtd:0,valor:0};e.qtd++;e.valor+=o.t;m.set(k,e);});
    return [...m.values()].sort((a,b)=>a.k.localeCompare(b.k));})();

  h+='<div class="grid g2" style="margin-top:16px">'+
    card('Evolução no período', area(semanas.map(s=>({rotulo:F.dts(s.k),valor:s.valor,tip:'<strong>Semana de '+F.dt(s.k)+'</strong><br>'+F.m(s.valor)+'<br>'+s.qtd+' OS'}))))+
    card('Gastos por tipo de serviço', barsH(porGrupo(os).slice(0,10).map(g=>({rotulo:g.k,valor:g.valor,filtro:g.k,chaveF:'grupo',tip:'<strong>'+F.e(g.k)+'</strong><br>'+F.m(g.valor)+'<br>'+g.qtd+' serviços<br><em>clique para filtrar</em>'}))))+
    '</div>';

  h+='<div class="grid g2" style="margin-top:16px">'+
    card('Gastos por local', barsH(agrupar(os,o=>o.l).slice(0,10).map(e=>({rotulo:e.k,valor:e.valor,filtro:e.k,chaveF:'local',tip:'<strong>'+F.e(e.k)+'</strong><br>'+F.m(e.valor)+'<br>'+e.qtd+' OS · '+e.veic.size+' veículos<br><em>clique para filtrar</em>'}))))+
    card('Serviços por mecânico', barsV(agrupar(os,o=>o.m).map(e=>({rotulo:e.k,valor:e.qtd,filtro:e.k,chaveF:'mecanico',tip:'<strong>'+F.e(e.k)+'</strong><br>'+e.qtd+' OS · '+F.m(e.valor)+'<br><em>clique para filtrar</em>'})),{fmt:F.n}))+
    '</div>';

  const topV=agrupar(os,o=>o.id+'|'+o.vn+'|'+o.p+'|'+o.f);
  h+='<div style="margin-top:16px">'+card('Veículos com maior custo',
    barsH(topV.slice(0,10).map(e=>{const [id,vn,p]=e.k.split('|');
      const r=os.filter(o=>o.id===id&&o.r).length;
      return {rotulo:vn+' '+(p!=='—'?p:''),valor:e.valor,destaque:r>0,
        tip:'<strong>'+F.e(vn)+'</strong> · '+F.e(p)+'<br>'+F.m(e.valor)+' em '+e.qtd+' OS'+(r?'<br>⚠️ '+r+' reincidência(s)':'')};})) +
    '<div class="legend"><span><i style="background:'+AMBAR+'"></i>com reincidência</span><span><i style="background:'+AZUL+'"></i>sem reincidência</span></div>')+'</div>';

  const linhaVeic=e=>{const [id,vn,p,f]=e.k.split('|');
    const ls=os.filter(o=>o.id===id);
    const its=ls.reduce((s,o)=>s+o.i.length,0), r=ls.filter(o=>o.r).length;
    return [F.e(vn),F.e(p),F.e(f),F.n(e.qtd),F.n(its),F.m(e.valor), r?'<span class="badge b-amber">'+r+'</span>':'—'];};
  const colVeic=['Veículo','Placa','Frota','OS','Serviços','Total gasto','Reincid.'];
  h+='<div style="margin-top:16px">'+card('Veículos atendidos',

}
function card(t,c,semPad){return '<section class="card sec"><h2>'+F.e(t)+'</h2><div class="'+(semPad?'':'pad')+'">'+c+'</div></section>';}
function tabela(cols,linhas,tot){
  if(!linhas.length) return vazio('Nenhum registro.');
  let s='<div class="tw"><table><thead><tr>'+cols.map((c,i)=>'<th'+(i>2?' class="r"':'')+'>'+F.e(c)+'</th>').join('')+'</tr></thead><tbody>';
  linhas.forEach(l=>{s+='<tr>'+l.map((c,i)=>'<td'+(i>2?' class="r"':'')+'>'+c+'</td>').join('')+'</tr>';});
  if(tot) s+='<tr class="tot">'+tot.map((c,i)=>'<td'+(i>2?' class="r"':'')+'>'+c+'</td>').join('')+'</tr>';
  return s+'</tbody></table></div>';
}
function sincronizar(){
  ['local','grupo','mecanico','tipo'].forEach(k=>{const el=document.getElementById('fx-'+k); if(el) el.value=FX[k];});
  const ch=document.getElementById('chips'); const ativos=[];
  if(FX.local) ativos.push(['local',FX.local]);
  if(FX.grupo) ativos.push(['grupo',FX.grupo]);
  if(FX.mecanico) ativos.push(['mecanico',FX.mecanico]);
  if(FX.tipo) ativos.push(['tipo',FX.tipo]);
  ch.innerHTML = ativos.length
    ? ativos.map(a=>'<button class="chip on" data-limpa="'+a[0]+'">'+F.e(a[1])+' ✕</button>').join('')+
      '<button class="chip" data-limpa="__todos">Limpar tudo</button>'
    : '<span class="dim">Clique nas barras dos gráficos para filtrar o painel.</span>';
  ch.querySelectorAll('[data-limpa]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.getAttribute('data-limpa');
    if(k==='__todos'){FX.local=FX.grupo=FX.mecanico=FX.tipo='';} else FX[k]='';
    sincronizar(); pintar();
  }));
}
window.addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(d=>d.open=true));
function iniciar(){
  const uni=(fn)=>[...new Set(D.linhas.map(fn))].filter(Boolean).sort();
  const opt=(l,v)=>'<option value="'+F.e(v)+'">'+F.e(l)+'</option>';
  const sel=(id,rot,lista)=>'<select id="fx-'+id+'"><option value="">'+rot+'</option>'+lista.map(x=>opt(x,x)).join('')+'</select>';
  document.getElementById('filtros').innerHTML=
    sel('local','Todos os locais',uni(o=>o.l))+
    sel('grupo','Todos os serviços',[...new Set(D.linhas.flatMap(o=>o.i.map(x=>x.g)))].sort())+
    sel('mecanico','Todos os mecânicos',uni(o=>o.m))+
    sel('tipo','Todos os tipos',uni(o=>o.tp))+
    '<button class="btn" onclick="window.print()">Imprimir / PDF</button>';
  ['local','grupo','mecanico','tipo'].forEach(k=>
    document.getElementById('fx-'+k).addEventListener('change',e=>{FX[k]=e.target.value; sincronizar(); pintar();}));
  sincronizar(); pintar();
}
iniciar();

  const nomeArquivo = d => `Painel-Frotas-Brilhante-${d.de}-a-${d.ate}.html`;

  function baixar(de, ate) {
    const d = coletar(de, ate);
    if (!d.linhas.length) { UI.toast('Não há ordens de serviço neste período para exportar.', 'warn'); return null; }
    const conteudo = html(d), nome = nomeArquivo(d);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([conteudo], { type: 'text/html;charset=utf-8' }));
    a.download = nome; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    UI.toast('Painel baixado: ' + nome, 'ok');
    return { conteudo, nome };
  }

  async function compartilhar(de, ate) {
    const d = coletar(de, ate);
    if (!d.linhas.length) { UI.toast('Não há ordens de serviço neste período para compartilhar.', 'warn'); return; }
    const arquivo = new File([html(d)], nomeArquivo(d), { type: 'text/html' });
    if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
      try {
        await navigator.share({ files: [arquivo], title: 'Painel de Manutenção — Grupo Brilhante', text: resumoTexto(d) });
        return;
      } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    baixar(de, ate);
    UI.toast('Compartilhamento direto indisponível neste navegador — o arquivo foi baixado.', 'warn');
  }

  /** Resumo curto para colar no WhatsApp / e-mail. */
  function resumoTexto(d) {
    const total = d.linhas.reduce((s, o) => s + o.t, 0);
    const veic = new Set(d.linhas.map(o => o.id)).size;
    const rec = d.linhas.filter(o => o.r).length;
    const varia = d.totalAnterior ? ((total - d.totalAnterior) / d.totalAnterior) * 100 : null;
    const top = {};
    d.linhas.forEach(o => { const k = o.vn + (o.p !== '—' ? ' ' + o.p : ''); top[k] = (top[k] || 0) + o.t; });
    const top3 = Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 3);
    return [
      'GRUPO BRILHANTE — Manutenção de Frotas',
      'Período: ' + Fmt.date(d.de) + ' a ' + Fmt.date(d.ate),
      '',
      'Valor total: ' + Fmt.money(total),
      'Ordens de serviço: ' + d.linhas.length,
      'Veículos atendidos: ' + veic,
      'Custo médio por OS: ' + Fmt.money(d.linhas.length ? total / d.linhas.length : 0),
      'Reincidências: ' + rec,
      varia == null ? '' : 'Variação vs. período anterior: ' + (varia > 0 ? '+' : '') + Fmt.num1(varia) + '%',
      '',
      'Maiores custos:',
      ...top3.map((t, i) => (i + 1) + '. ' + t[0] + ' — ' + Fmt.money(t[1])),
    ].filter(x => x !== '').join('\n');
  }

  async function copiarResumo(de, ate) {
    const d = coletar(de, ate);
    if (!d.linhas.length) { UI.toast('Não há dados neste período.', 'warn'); return; }
    const txt = resumoTexto(d);
    try {
      await navigator.clipboard.writeText(txt);
      UI.toast('Resumo copiado — cole no WhatsApp ou e-mail.', 'ok');
    } catch (e) {
      UI.modal('Resumo do período', `<textarea class="input" style="min-height:260px" readonly>${Fmt.esc(txt)}</textarea>`,
        `<button class="btn" data-fechar>Fechar</button>`);
    }
  }

  return { coletar, html, baixar, compartilhar, copiarResumo, resumoTexto };
})();

        `<span class="badge b-gray" style="font-size:10.5px">${Fmt.esc(Perm.nome(x))}</span>`).join('')}</div>
        </div>`).join('')}</div>
        <p class="dim" style="font-size:12px;margin:var(--s4) 0 0">O perfil é um atalho: ao cadastrar, você pode marcar ou desmarcar
        qualquer permissão individualmente para aquele usuário.</p>`)}
    </div>`;
  }

  function lista() {
    const us = DB.usuarios().filter(u =>
      (!filtroPerfil || u.perfil === filtroPerfil) &&
      (!busca || (u.nome + ' ' + u.usuario + ' ' + (u.setor || '')).toLowerCase().includes(busca.toLowerCase())));
    const eu = Estado.usuario ? Estado.usuario.id : '';
    const linhas = us.map(u => ({
      n: `<div class="strong">${Fmt.esc(u.nome)}${u.id === eu ? ' <span class="badge b-blue">você</span>' : ''}</div>
          <div class="dim" style="font-size:11.5px">${Fmt.esc(u.setor || 'Setor não informado')}</div>`,
      us: `<span class="mono">${Fmt.esc(u.usuario)}</span>`,
      pf: `<span class="badge ${u.perfil === 'Administrador' ? 'b-blue' : 'b-gray'}">${Fmt.esc(u.perfil)}</span>` +
        (ehPadrao(u) ? '' : ' <span class="badge b-amber" title="Permissões ajustadas manualmente">personalizado</span>'),
      pm: `<span class="dim">${(u.permissoes || []).length} de ${Perm.TODAS.length}</span>`,
      st: u.status === 'Ativo' ? '<span class="badge b-green">Ativo</span>' : '<span class="badge b-gray">Inativo</span>',
      ac: `<span class="nowrap">${Fmt.date(u.ultimoAcesso) === '—' ? '<span class="dim">nunca entrou</span>' : Fmt.date(u.ultimoAcesso)}</span>`,
      ax: `<button class="btn ghost sm" data-edit-u="${u.id}">Editar</button>`,
    }));
    const el = document.getElementById('u-cont');
    if (el) el.textContent = us.length + ' de ' + DB.usuarios().length + ' usuários';
    return UI.card('', UI.tabela([{ t: 'Nome', k: 'n' }, { t: 'Usuário', k: 'us' }, { t: 'Perfil', k: 'pf' },
    { t: 'Permissões', k: 'pm' }, { t: 'Situação', k: 'st' }, { t: 'Último acesso', k: 'ac' }, { t: '', k: 'ax', cls: 'ta-r' }],
      linhas, { vazioT: 'Nenhum usuário encontrado', vazioM: 'Ajuste a busca ou cadastre um novo usuário.' }), '', true);
  }

  function checkboxes(marcadas, perfil) {
    const grupos = {};
    Perm.LISTA.forEach(p => (grupos[p.grupo] = grupos[p.grupo] || []).push(p));
    return Object.keys(grupos).map(g => `<div style="margin-bottom:var(--s3)">
      <div class="eyebrow" style="margin-bottom:6px">${Fmt.esc(g)}</div>
      <div class="perm-grid">${grupos[g].map(p => {
        const bloqueada = p.id === 'dashboard' && perfil === 'Mecânico';
        return `<label class="perm-item"${bloqueada ? ' title="Mecânico não vê o dashboard, mesmo marcando aqui"' : ''}>
        <input type="checkbox" data-perm="${p.id}"${(marcadas.includes(p.id) && !bloqueada) ? ' checked' : ''}${bloqueada ? ' disabled' : ''}>
        <span${bloqueada ? ' class="dim"' : ''}>${Fmt.esc(p.nome)}${bloqueada ? ' (bloqueado p/ Mecânico)' : ''}</span></label>`;
      }).join('')}</div></div>`).join('');
  }

  function editar(id) {
    const orig = id ? DB.usuarios().find(x => x.id === id) : null;
    const u = orig ? JSON.parse(JSON.stringify(orig)) : {
      id: '', nome: '', usuario: '', senha: '', perfil: 'Mecânico',
      permissoes: Perm.doPerfil('Mecânico'), status: 'Ativo', setor: '', ultimoAcesso: ''
    };
    const eu = Estado.usuario && Estado.usuario.id === u.id;
    const ultimoAdmin = orig && orig.perfil === 'Administrador' && orig.status === 'Ativo' && contaAdmins() <= 1;

    UI.modal(orig ? 'Editar usuário' : 'Cadastrar usuário', `
      <div class="form-grid">
        <div class="field"><label for="uu-nome">Nome completo</label><input class="input" id="uu-nome" value="${Fmt.esc(u.nome)}"></div>
        <div class="field"><label for="uu-user">Usuário (login)</label><input class="input" id="uu-user" autocapitalize="none" value="${Fmt.esc(u.usuario)}"></div>
        <div class="field"><label for="uu-senha">${orig ? 'Nova senha' : 'Senha'}</label>
          <input class="input" type="text" id="uu-senha" placeholder="${orig ? 'deixe em branco para manter' : 'defina uma senha'}"></div>
        <div class="field"><label for="uu-setor">Setor</label><input class="input" id="uu-setor" list="dl-setores" value="${Fmt.esc(u.setor || '')}">
          ${datalist('dl-setores', ['Compras', 'Oficina', 'Almoxarifado', 'Frota', 'Logística', 'Agrícola', 'Pecuária', 'Financeiro', 'Diretoria'])}</div>
        <div class="field"><label for="uu-perfil">Perfil de acesso</label>
          <select class="input" id="uu-perfil">${UI.opcoes(Perm.nomesPerfis(), u.perfil)}</select>
          <div class="dim" id="uu-perfil-desc" style="font-size:11.5px;margin-top:5px"></div></div>
        <div class="field"><label for="uu-status">Situação</label>
          <select class="input" id="uu-status"${ultimoAdmin ? ' disabled' : ''}>${UI.opcoes(['Ativo', 'Inativo'], u.status)}</select>
          ${ultimoAdmin ? '<div class="dim" style="font-size:11.5px;margin-top:5px">Único administrador ativo — não pode ser inativado.</div>' : ''}</div>
      </div>
      <div style="margin-top:var(--s4)">
        <div class="row" style="margin-bottom:var(--s3)">
          <h3 style="flex:1">O que este usuário pode fazer</h3>
          <button type="button" class="btn ghost sm" id="uu-padrao">Restaurar padrão do perfil</button>
        </div>
        <div id="uu-perms">${checkboxes(u.permissoes || [], u.perfil)}</div>
        <p class="dim" style="font-size:12px;margin:0">Administrador tem acesso total independentemente das marcações.</p>
      </div>`,
      `${orig && !eu ? `<button class="btn danger" id="uu-excluir" style="margin-right:auto">Excluir usuário</button>` : ''}
       <button class="btn ghost" data-fechar>Cancelar</button>
       <button class="btn" id="uu-salvar">${orig ? 'Salvar alterações' : 'Cadastrar usuário'}</button>`, '760px');

    const $ = i => document.getElementById(i);
    const descPerfil = () => { $('uu-perfil-desc').textContent = Perm.PERFIS[$('uu-perfil').value].desc; };
    descPerfil();
    $('uu-perfil').addEventListener('change', () => {
      descPerfil();
      $('uu-perms').innerHTML = checkboxes(Perm.doPerfil($('uu-perfil').value), $('uu-perfil').value);
    });
    $('uu-padrao').addEventListener('click', () => { $('uu-perms').innerHTML = checkboxes(Perm.doPerfil($('uu-perfil').value), $('uu-perfil').value); });

    const bx = $('uu-excluir');
    if (bx) bx.addEventListener('click', () => {
      UI.modal('Excluir ' + u.nome, '<p>O usuário perde o acesso imediatamente. As ordens de serviço que ele registrou continuam na base.</p>',
        `<button class="btn ghost" data-fechar>Manter</button><button class="btn danger" id="uu-conf-excluir">Excluir usuário</button>`);
      $('uu-conf-excluir').addEventListener('click', () => {
        if (!DB.excluirUsuario(u.id)) { UI.toast('Este é o único administrador ativo — não pode ser excluído.', 'warn'); return; }
        UI.fecharModal(); UI.toast('Usuário excluído.', 'ok'); App.render();
      });
    });

    $('uu-salvar').addEventListener('click', () => {
      const nome = $('uu-nome').value.trim(), login = $('uu-user').value.trim(), senha = $('uu-senha').value;
      if (!nome) { UI.toast('Informe o nome do usuário.', 'warn'); $('uu-nome').focus(); return; }
      if (!login) { UI.toast('Informe o usuário de login.', 'warn'); $('uu-user').focus(); return; }
      const dup = DB.usuarioPorLogin(login);
      if (dup && dup.id !== u.id) { UI.toast('Já existe um usuário com o login "' + login + '".', 'warn'); return; }
      if (!orig && senha.length < 4) { UI.toast('Defina uma senha com pelo menos 4 caracteres.', 'warn'); $('uu-senha').focus(); return; }

      u.nome = nome; u.usuario = login; u.setor = $('uu-setor').value.trim();
      u.perfil = $('uu-perfil').value;
      u.status = $('uu-status').disabled ? 'Ativo' : $('uu-status').value;
      if (senha) u.senha = senha;
      u.permissoes = [...document.querySelectorAll('#uu-perms [data-perm]:checked')].map(c => c.dataset.perm);
      if (u.perfil === 'Administrador') u.permissoes = Perm.TODAS.slice();

      DB.salvarUsuario(u);
      UI.fecharModal();
      UI.toast(orig ? 'Usuário atualizado.' : 'Usuário cadastrado.', 'ok');
      if (eu) { Auth.aplicar(DB.usuarios().find(x => x.id === u.id)); }
      App.render();
    });
  }

  function ligar() {
    const pintar = () => { document.getElementById('lista-usuarios').innerHTML = lista(); ligarLista(); };
    pintar();
    document.getElementById('u-busca').addEventListener('input', e => { busca = e.target.value; pintar(); });
    document.getElementById('u-perfil').addEventListener('change', e => { filtroPerfil = e.target.value; pintar(); });
    const bn = document.getElementById('novo-usuario');
    if (bn) bn.addEventListener('click', () => editar(''));
  }
  const ligarLista = () => document.querySelectorAll('[data-edit-u]').forEach(b =>
    b.addEventListener('click', () => editar(b.dataset.editU)));

  /* ---------- minha conta ---------- */
  function minhaConta() {
    const u = DB.usuarios().find(x => x.id === Estado.usuario.id);
    if (!u) return UI.vazio('Sessão expirada', 'Entre novamente no sistema.');
    App.aoRenderizar = () => {
      const $ = i => document.getElementById(i);
      $('mc-salvar').addEventListener('click', () => {
        const nome = $('mc-nome').value.trim();
        if (!nome) { UI.toast('Informe seu nome.', 'warn'); return; }
        u.nome = nome; DB.salvarUsuario(u); Auth.aplicar(u);
        UI.toast('Dados atualizados.', 'ok'); App.render();
      });
      $('mc-trocar').addEventListener('click', () => {
        const atual = $('mc-atual').value, nova = $('mc-nova').value, conf = $('mc-conf').value;
        if (String(atual) !== String(u.senha)) { UI.toast('A senha atual não confere.', 'warn'); $('mc-atual').focus(); return; }
        if (nova.length < 4) { UI.toast('A nova senha precisa de pelo menos 4 caracteres.', 'warn'); return; }
        if (nova !== conf) { UI.toast('A confirmação não confere com a nova senha.', 'warn'); return; }
        u.senha = nova; DB.salvarUsuario(u);
        $('mc-atual').value = $('mc-nova').value = $('mc-conf').value = '';
        UI.toast('Senha alterada.', 'ok');
      });
    };
    App.acoesTopo('');
    return `<div class="stack">
      ${UI.card('Meus dados', `
        <div class="form-grid">
          <div class="field"><label for="mc-nome">Nome</label><input class="input" id="mc-nome" value="${Fmt.esc(u.nome)}"></div>
          <div class="field"><label for="mc-user">Usuário</label><input class="input" id="mc-user" value="${Fmt.esc(u.usuario)}" readonly></div>
          <div class="field"><label for="mc-perfil">Perfil</label><input class="input" id="mc-perfil" value="${Fmt.esc(u.perfil)}" readonly></div>
          <div class="field"><label for="mc-setor">Setor</label><input class="input" id="mc-setor" value="${Fmt.esc(u.setor || '—')}" readonly></div>
        </div>
        <div class="row" style="margin-top:var(--s3)"><button class="btn sm" id="mc-salvar">Salvar nome</button></div>`)}

      ${UI.card('Trocar senha', `
        <div class="form-grid">
          <div class="field"><label for="mc-atual">Senha atual</label><input class="input" type="password" id="mc-atual" autocomplete="current-password"></div>
          <div class="field"><label for="mc-nova">Nova senha</label><input class="input" type="password" id="mc-nova" autocomplete="new-password"></div>
          <div class="field"><label for="mc-conf">Confirmar nova senha</label><input class="input" type="password" id="mc-conf" autocomplete="new-password"></div>
        </div>
        <div class="row" style="margin-top:var(--s3)"><button class="btn sm" id="mc-trocar">Alterar senha</button></div>`)}

      ${UI.card('O que eu posso fazer', `<div class="perm-grid">${Perm.LISTA.map(p => {
        const tem = u.perfil === 'Administrador' || (u.permissoes || []).includes(p.id);
        return `<div class="perm-item" style="cursor:default"><span class="badge ${tem ? 'b-green' : 'b-gray'}">${tem ? 'sim' : 'não'}</span>
          <span${tem ? '' : ' class="dim"'}>${Fmt.esc(p.nome)}</span></div>`;
      }).join('')}</div>`)}
    </div>`;
  }

  return { pagina, minhaConta, editar };
})();


/* ============================================================
   CONFIGURAÇÕES — parâmetros, base de dados e qualidade dos dados
   ============================================================ */
const Config = (() => {
  function pagina() {
    const b = DB.get(), c = DB.cfg();
    const semData = b.ordens.filter(o => !o.data);
    const suspeitas = b.ordens.filter(o => o.dataSuspeita);
    const semValor = b.ordens.filter(o => !o.total);
    App.aoRenderizar = ligar;
    App.acoesTopo('');

    const revisar = [...semData.map(o => ({ o, m: 'Sem data na planilha' })),
    ...suspeitas.map(o => ({ o, m: 'Data corrigida na importação (ano fora de 2026)' })),
    ...semValor.map(o => ({ o, m: 'Valor total zerado' }))];

    return `<div class="stack">
      ${UI.card('Regras de reincidência', `
        <div class="form-grid">
          <div class="field"><label for="c-janela">Janela de reincidência (dias)</label>
            <input class="input" type="number" min="7" max="365" id="c-janela" value="${c.janelaReincidencia}">
            <div class="dim" style="font-size:11.5px;margin-top:5px">Um retorno pelo mesmo sistema dentro deste prazo é sinalizado como reincidência.</div></div>
          <div class="field"><label for="c-osmes">Alerta de OS por veículo no período</label>
            <input class="input" type="number" min="1" max="20" id="c-osmes" value="${c.alertaOSmes}">
            <div class="dim" style="font-size:11.5px;margin-top:5px">Acima deste número o veículo aparece nos alertas gerenciais.</div></div>
        </div>
        <div class="row" style="margin-top:var(--s3)"><button class="btn sm" id="c-salvar">Salvar parâmetros</button></div>`)}

      ${UI.card('Base de dados', `
        <p>A planilha <strong>${Fmt.esc(b.origem)}</strong> é a base do sistema. Os lançamentos ficam gravados
        neste navegador e podem ser atualizados a qualquer momento importando a planilha da semana.</p>
        <div class="grid kpis" style="margin:var(--s4) 0">
          ${UI.kpi('Ordens de serviço', Fmt.num(b.ordens.length))}
          ${UI.kpi('Serviços cadastrados', Fmt.num(b.servicos.length))}
          ${UI.kpi('Veículos', Fmt.num(b.veiculos.length))}
          ${UI.kpi('Valor histórico', Fmt.money0(b.ordens.reduce((s, o) => s + o.total, 0)))}
        </div>
        <div class="row">
          ${Perm.pode('importar') ? `<button class="btn" id="c-importar">${Ico.imp} Importar planilha (.xlsx)</button>` : ''}
          ${Perm.pode('exportar') ? '<button class="btn ghost" id="c-exportar">Exportar backup (.json)</button>' : ''}
          ${Perm.pode('importar') ? '<button class="btn ghost" id="c-imp-backup">Importar backup (.json)</button>' : ''}
          ${Perm.pode('usuarios') ? '<button class="btn ghost" id="c-restaurar">Restaurar dados da planilha original</button>' : ''}
        </div>
        <p class="dim" style="font-size:12px;margin:var(--s3) 0 0">A importação mostra uma prévia antes de gravar e ignora lançamentos que já existem.</p>`)}

      ${UI.card('Versão publicada', `
        <p>Esta é a <strong>versão ${VERSAO.n}</strong>, gerada em ${VERSAO.data}.
        Confira este número depois de publicar no endereço oficial
        <strong>brilhante.vercel.app</strong> — se aparecer um número menor, o navegador está
        mostrando a versão antiga: atualize com <strong>Ctrl + Shift + R</strong>.</p>`)}

      ${UI.card('Onde os dados ficam guardados', `
        <p>Os lançamentos ficam gravados <strong>dentro do navegador de cada pessoa</strong>. Isso vale tanto para o arquivo
        aberto no computador quanto para o endereço publicado na internet — são <strong>cofres separados</strong>:
        o que foi digitado em um não aparece no outro, e cada celular ou computador que abrir o site começa com a base original da planilha.</p>
        <ol class="lista-passos">
          <li>No computador onde estão os lançamentos, clique em <strong>Exportar backup (.json)</strong>.</li>
          <li>Abra o sistema no endereço publicado e entre como administrador.</li>
          <li>Clique em <strong>Importar backup (.json)</strong> e escolha o arquivo. Use <em>Substituir</em> na primeira vez e <em>Acrescentar</em> nas seguintes.</li>
        </ol>
        <p class="dim" style="font-size:12px;margin:var(--s3) 0 0">Enquanto não houver um servidor central, exporte o backup ao fim de cada semana:
        é o que garante a base se o navegador for limpo ou o computador trocado. Vale lembrar também que as senhas ficam gravadas
        em texto no navegador — o controle de acesso organiza a rotina, mas não protege como uma autenticação de servidor.</p>`)}

      ${UI.card('Dados a revisar', revisar.length ? `
        <p class="dim">Registros importados com inconsistência na planilha. Nada foi apagado — corrija quando for conveniente.</p>
        ${UI.tabela([{ t: 'OS', k: 'n' }, { t: 'Veículo', k: 'v' }, { t: 'Data', k: 'd' }, { t: 'Situação encontrada', k: 'm' }, { t: '', k: 'a', cls: 'ta-r' }],
      revisar.slice(0, 40).map(r => ({
        n: r.o.numero, v: Fmt.esc(DB.nomeVeiculo(r.o.veiculoId)), d: Fmt.date(r.o.data),
        m: `<span class="badge b-amber">${Fmt.esc(r.m)}</span>`,
        a: `<button class="btn ghost sm" data-osrev="${r.o.id}">Abrir</button>`
      })), {})}` : UI.vazio('Base consistente', 'Nenhum registro pendente de revisão.'), '', revisar.length ? true : false)}

      ${UI.card('Acesso ao sistema', `
        <p>Cada pessoa entra com o próprio login, e o perfil define o que ela enxerga e pode alterar.</p>
        <div class="grid kpis" style="margin:var(--s4) 0">
          ${UI.kpi('Usuários cadastrados', Fmt.num(DB.usuarios().length))}
          ${UI.kpi('Ativos', Fmt.num(DB.usuarios().filter(u => u.status === 'Ativo').length))}
          ${UI.kpi('Administradores', Fmt.num(DB.usuarios().filter(u => u.perfil === 'Administrador').length))}
          ${UI.kpi('Perfis disponíveis', Fmt.num(Perm.nomesPerfis().length))}
        </div>
        <div class="row">
          ${Perm.pode('usuarios') ? '<button class="btn" data-ir="usuarios">Gerenciar usuários e acessos</button>' : ''}
          <button class="btn ghost" data-ir="minha-conta">Minha conta e senha</button>
        </div>`)}
    </div>`;
  }

  function ligar() {
    const $ = id => document.getElementById(id);
    $('c-salvar').addEventListener('click', () => {
      const c = DB.cfg();
      c.janelaReincidencia = Math.min(365, Math.max(7, +$('c-janela').value || 90));
      c.alertaOSmes = Math.min(20, Math.max(1, +$('c-osmes').value || 3));
      DB.save(); UI.toast('Parâmetros salvos.', 'ok'); App.render();
    });
    document.querySelectorAll('[data-ir]').forEach(b => b.addEventListener('click', () => App.irPara(b.dataset.ir)));
    if ($('c-importar')) $('c-importar').addEventListener('click', () => Importar.abrir());
    if ($('c-exportar')) $('c-exportar').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([DB.exportarJSON()], { type: 'application/json' }));
      a.download = 'backup-os-brilhante-' + Dt.today() + '.json';
      a.click(); URL.revokeObjectURL(a.href);
      UI.toast('Backup exportado.', 'ok');
    });
    if ($('c-imp-backup')) $('c-imp-backup').addEventListener('click', abrirBackup);
    if ($('c-restaurar')) $('c-restaurar').addEventListener('click', () => {
      UI.modal('Restaurar dados originais',
        '<p>Isso descarta as ordens de serviço criadas no sistema e volta ao conteúdo da planilha importada. Não é possível desfazer.</p>',
        `<button class="btn ghost" data-fechar>Cancelar</button><button class="btn danger" id="conf-rest">Restaurar</button>`);
      $('conf-rest').addEventListener('click', () => { DB.restaurar(); UI.fecharModal(); UI.toast('Base restaurada.', 'ok'); App.render(); });
    });
    document.querySelectorAll('[data-osrev]').forEach(b => b.addEventListener('click', () => App.irPara('ordens/' + b.dataset.osrev)));
  }

  /* ---------- Importar backup (.json) ---------- */
  function abrirBackup() {
    UI.modal('Importar backup (.json)', `
      <p>Escolha o arquivo <strong>backup-os-brilhante-….json</strong> exportado no outro computador.
      Nada é gravado antes de você conferir a prévia.</p>
      <div class="field" style="margin-top:var(--s3)">
        <input class="input" type="file" id="bk-arq" accept=".json,application/json">
      </div>
      <div id="bk-previa"></div>`,
      `<button class="btn ghost" data-fechar>Cancelar</button>
       <button class="btn" id="bk-mesclar" disabled>Acrescentar o que falta</button>
       <button class="btn danger" id="bk-subst" disabled>Substituir a base</button>`);

    const $ = id => document.getElementById(id);
    let base = null;

    $('bk-arq').addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        base = DB.lerBackup(await f.text());
        const c = DB.conferirBackup(base);
        $('bk-previa').innerHTML = `
          <div class="grid kpis" style="margin:var(--s4) 0">
            ${UI.kpi('OS no arquivo', Fmt.num(c.arquivo.ordens), Fmt.money0(c.arquivo.total))}
            ${UI.kpi('OS nesta base', Fmt.num(c.atual.ordens), Fmt.money0(c.atual.total))}
            ${UI.kpi('OS que ainda faltam aqui', Fmt.num(c.novas.ordens))}
          </div>
          <p><strong>Acrescentar o que falta:</strong> soma ${Fmt.num(c.novas.ordens)} ordens,
             ${Fmt.num(c.novas.veiculos)} veículos, ${Fmt.num(c.novas.servicos)} serviços e
             ${Fmt.num(c.novas.usuarios)} usuários, sem apagar nada do que já existe aqui.</p>
          <p><strong>Substituir a base:</strong> descarta o conteúdo atual deste navegador e deixa exatamente
             o que está no arquivo (${Fmt.num(c.arquivo.ordens)} ordens, ${Fmt.num(c.arquivo.veiculos)} veículos,
             ${Fmt.num(c.arquivo.usuarios)} usuários). Use na primeira carga do sistema publicado.</p>
          ${base.origem ? `<p class="dim" style="font-size:12px">Origem do arquivo: ${Fmt.esc(base.origem)}</p>` : ''}`;
        $('bk-mesclar').disabled = false; $('bk-subst').disabled = false;
      } catch (err) {
        base = null; $('bk-previa').innerHTML = `<p class="badge b-amber" style="display:inline-block;margin-top:var(--s3)">${Fmt.esc(err.message)}</p>`;
        $('bk-mesclar').disabled = true; $('bk-subst').disabled = true;
      }
    });

    const aplicar = modo => {
      if (!base) return;
      const r = DB.importarBackup(base, modo);
      UI.fecharModal();
      UI.toast(modo === 'substituir'
        ? `Base substituída: ${Fmt.num(r.ordens)} ordens e ${Fmt.num(r.usuarios)} usuários.`
        : `Backup acrescentado: +${r.ordens} OS, +${r.veiculos} veículos, +${r.servicos} serviços, +${r.usuarios} usuários.`, 'ok');
      Auth.revalidar(); App.render();
    };
    $('bk-mesclar').addEventListener('click', () => aplicar('mesclar'));
    $('bk-subst').addEventListener('click', () => {
      UI.modal('Confirmar substituição',
        '<p>Todo o conteúdo gravado neste navegador será descartado e trocado pelo do arquivo. Não é possível desfazer.</p>',
        `<button class="btn ghost" data-fechar>Cancelar</button><button class="btn danger" id="bk-ok">Substituir</button>`);
      document.getElementById('bk-ok').addEventListener('click', () => aplicar('substituir'));
    });
  }
  return { pagina };
})();

/* ============================================================
   SINCRONIZAÇÃO COM SUPABASE — Ordens de Serviço
   As O.S. passam a ser gravadas/lidas na nuvem, para acesso de
   qualquer computador. O localStorage continua como reserva
   offline: se a internet cair, o app segue funcionando e
   sincroniza quando a conexão voltar.
   (Login, usuários, veículos e serviços seguem locais.)
   ============================================================ */
const Nuvem = (() => {
  const URL = 'https://ysszhioygqyjbcgjgpca.supabase.co';
  const KEY = 'sb_publishable_YCcTEzIBU08P-P-xxlKTkA_2eJE-irT';
  const H = { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' };
  let online = true;

  // OS do app  ->  linha do banco
  const paraLinha = o => ({
    id: o.id, numero: o.numero ?? null, data: o.data || null, veiculo_id: o.veiculoId || null,
    placa: o.placa || null, frota: o.frota || null, local: o.local || null, condutor: o.condutor || null,
    mecanico: o.mecanico || null, km_h: (o.kmH ?? null), tipo_medidor: o.tipoMedidor || null,
    obs: o.obs || null, itens: o.itens || [], total: o.total || 0,
    criado_por: o.criadoPor || null, criado_data: o.criadoData || null, criado_hora: o.criadoHora || null,
    alterado_por: o.alteradoPor || null, alterado_data: o.alteradoData || null, alterado_hora: o.alteradoHora || null
  });
  // linha do banco  ->  OS do app
  const paraOS = l => ({
    id: l.id, numero: l.numero, data: l.data, veiculoId: l.veiculo_id,
    placa: l.placa, frota: l.frota, local: l.local, condutor: l.condutor,
    mecanico: l.mecanico, kmH: l.km_h == null ? null : Number(l.km_h),
    tipoMedidor: l.tipo_medidor, obs: l.obs, itens: l.itens || [], total: Number(l.total) || 0,
    criadoPor: l.criado_por, criadoData: l.criado_data, criadoHora: l.criado_hora,
    alteradoPor: l.alterado_por, alteradoData: l.alterado_data, alteradoHora: l.alterado_hora
  });

  async function req(path, opts) {
    const r = await fetch(URL + '/rest/v1/' + path, { ...opts, headers: { ...H, ...(opts && opts.headers) } });
    if (!r.ok) throw new Error('Supabase ' + r.status);
    return r;
  }
  const enviarUma = os => req('ordens', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates' }, body: JSON.stringify(paraLinha(os)) });
  // envia várias de uma vez (migração), em blocos
  async function enviarVarias(lista) {
    for (let i = 0; i < lista.length; i += 100) {
      const bloco = lista.slice(i, i + 100).map(paraLinha);
      await req('ordens', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates' }, body: JSON.stringify(bloco) });
    }
  }
  const apagarUma = id => req('ordens?id=eq.' + encodeURIComponent(id), { method: 'DELETE' });
  async function baixarTodas() { return (await (await req('ordens?select=*')).json()).map(paraOS); }

  function marcadas() { return new Set(DB.get().sincronizados || []); }
  function marcar(ids, incluir) {
    const b = DB.get(); const s = new Set(b.sincronizados || []);
    ids.forEach(id => incluir ? s.add(id) : s.delete(id));
    b.sincronizados = [...s]; DB.save();
  }

  /* Sincroniza: sobe as O.S. locais que ainda não estão na nuvem
     (migração inicial + lançamentos feitos offline) e baixa o resto.
     A nuvem é a fonte da verdade — some do local o que foi excluído
     em outro computador. Devolve true se a base mudou. */
  async function sincronizar() {
    const base = DB.get();
    let remotas;
    try { remotas = await baixarTodas(); online = true; }
    catch (e) { online = false; return false; }               // offline: mantém o local
    const idsRemotos = new Set(remotas.map(o => o.id));
    const jaSync = marcadas();
    // sobe as locais nunca sincronizadas
    const subir = base.ordens.filter(o => !idsRemotos.has(o.id) && !jaSync.has(o.id));
    if (subir.length) { try { await enviarVarias(subir); } catch (e) { online = false; } }
    // base final = remotas + as que acabaram de subir
    const mapa = new Map(remotas.map(o => [o.id, o]));
    subir.forEach(o => { if (!mapa.has(o.id)) mapa.set(o.id, o); });
    base.ordens = [...mapa.values()];
    base.sincronizados = [...mapa.keys()];
    DB.save();
    return true;
  }

  // Chamados em segundo plano ao salvar/excluir uma O.S.
  function aoSalvar(os) { marcar([os.id], true); enviarUma(os).catch(() => marcar([os.id], false)); }
  function aoExcluir(id) { apagarUma(id).catch(() => {}); }

  return { sincronizar, aoSalvar, aoExcluir, get online() { return online; } };
})();
window.Nuvem = Nuvem;

/* Embrulha DB.salvarOS/excluirOS para espelhar na nuvem, sem alterar o core. */
(function ligarNuvem() {
  const _salvar = DB.salvarOS, _excluir = DB.excluirOS;
  DB.salvarOS = function (os) { const r = _salvar.call(DB, os); try { Nuvem.aoSalvar(r); } catch (e) { } return r; };
  DB.excluirOS = function (id) { const r = _excluir.call(DB, id); try { Nuvem.aoExcluir(id); } catch (e) { } return r; };
  // Ao abrir já logado, sincroniza em segundo plano e atualiza a tela.
  if (typeof Estado !== 'undefined' && Estado.usuario) {
    Nuvem.sincronizar().then(mudou => { if (mudou) App.render(); }).catch(() => { });
  }
})();
