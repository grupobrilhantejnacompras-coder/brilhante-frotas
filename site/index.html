<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C1F55">
<meta name="description" content="Sistema de ordens de serviço e gestão de manutenção de frotas do Grupo Brilhante.">
<title>Grupo Brilhante · Ordens de Serviço de Frotas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%231B3FAE%22/%3E%3Cpath d=%22M50 20 78 42 50 82 22 42Z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<style>
/* ============================================================
   GRUPO BRILHANTE — Sistema de Ordens de Serviço de Frotas
   Tokens visuais: azul royal (logo), cinza, branco.
   ============================================================ */
:root{
  color-scheme:dark;
  /* Command Center — azul elétrico + ciano como acento; cor forte só em ação/status */
  --royal:#1677FF; --royal-700:#0E63E6; --royal-800:#0B50BE; --royal-900:#07111F;
  --royal-50:rgba(22,119,255,.12); --royal-100:rgba(22,119,255,.34); --royal-300:#5AA0FF;
  --cyan:#00D9FF;
  --ink:#EAF1FB; --ink-2:#C4D3E6; --muted:#8296B2; --muted-2:#5E7391;
  --line:#1D3048; --line-2:#274063; --canvas:#0B1728; --surface:#132238; --surface-2:#101D30;
  --amber:#FFB020; --amber-bg:rgba(255,176,32,.13); --amber-line:rgba(255,176,32,.34);
  --green:#16D98A; --green-bg:rgba(22,217,138,.13); --red:#FF4D67; --red-bg:rgba(255,77,103,.14);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r:10px; --r-lg:14px;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 6px 20px rgba(0,0,0,.42);
  --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  --glow:0 0 0 1px rgba(22,119,255,.25), 0 8px 30px rgba(22,119,255,.12);
  --sans:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --nav-w:244px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--canvas);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-.015em; line-height:1.25}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
p{margin:0 0 var(--s3)}
a{color:var(--royal); text-decoration:none}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--royal); outline-offset:2px; border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* --------------------------------------------------- logo */
.logo{display:block; width:100%; height:auto; color:inherit}
.logo svg{display:block; width:100%; height:auto; fill:currentColor}

/* --------------------------------------------------- login */
#login{
  min-height:100vh; display:grid; place-items:center; padding:var(--s5); position:relative; overflow:hidden;
  background:
    radial-gradient(900px 520px at 18% -8%, rgba(22,119,255,.28) 0%, transparent 56%),
    radial-gradient(760px 460px at 108% 112%, rgba(0,217,255,.16) 0%, transparent 60%),
    var(--royal-900);
}
/* grade tecnológica discreta ao fundo */
#login::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:
    linear-gradient(rgba(90,160,255,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(90,160,255,.06) 1px, transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(1100px 620px at 50% 40%, #000 0%, transparent 78%);
          mask-image:radial-gradient(1100px 620px at 50% 40%, #000 0%, transparent 78%);
}
.login-card{
  position:relative; width:100%; max-width:392px; border-radius:var(--r-lg);
  background:linear-gradient(180deg, rgba(255,255,255,.04), transparent 32%), var(--surface);
  border:1px solid var(--line-2); padding:var(--s6) var(--s6) var(--s5);
  box-shadow:var(--shadow-lg), 0 0 0 1px rgba(22,119,255,.12), 0 0 60px rgba(22,119,255,.10);
}
.login-brand{display:flex; flex-direction:column; align-items:center; gap:var(--s3); margin-bottom:var(--s5)}
.login-brand .logo{width:104px; color:#fff; filter:drop-shadow(0 0 14px rgba(22,119,255,.55))}
.login-brand .name{font-size:16px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:#fff}
.login-brand .sub{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--royal-300); text-align:center}
.field{margin-bottom:var(--s4)}
.field label{display:block; font-size:12px; font-weight:600; color:var(--ink-2); margin-bottom:6px}
.input,select.input,textarea.input{
  width:100%; padding:10px 12px; border:1px solid var(--line-2); border-radius:8px;
  background:var(--surface-2); transition:border-color .15s, box-shadow .15s;
}
.input:focus{outline:none; border-color:var(--royal); box-shadow:0 0 0 3px var(--royal-100)}
.input[readonly]{background:var(--surface-2); color:var(--muted)}
.input.pendente{border-color:var(--amber-line); background:rgba(255,176,32,.07)}
.input.pendente:focus{border-color:var(--royal); background:var(--surface)}
textarea.input{min-height:88px; resize:vertical}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 16px; border-radius:8px; border:1px solid transparent; background:var(--royal);
  color:#fff; font-weight:600; cursor:pointer; transition:background .15s, transform .12s, box-shadow .15s;
  white-space:nowrap;
}
.btn:hover{background:var(--royal-700); transform:translateY(-1px); box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 10px 22px rgba(22,119,255,.32)}
.btn:active{transform:translateY(1px)}
.btn.block{width:100%}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line-2)}
.btn{box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 6px 16px rgba(22,119,255,.22)}
.btn.ghost{box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.05); border-color:var(--royal); color:var(--ink); transform:translateY(-1px); box-shadow:none}
.btn.sm{padding:6px 11px; font-size:12.5px; border-radius:7px}
.btn.danger{background:var(--red)} .btn.danger:hover{background:#96170F}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.login-err{background:var(--red-bg); color:var(--red); padding:9px 12px; border-radius:8px; font-size:13px; margin-bottom:var(--s3)}
.login-foot{margin-top:var(--s5); text-align:center; font-size:11px; color:var(--muted-2); letter-spacing:.06em}

/* --------------------------------------------------- shell */
#app{display:grid; grid-template-columns:var(--nav-w) 1fr; min-height:100vh}
.nav{
  background:linear-gradient(180deg,var(--royal-900) 0%, #0A1943 100%);
  color:#C7D2EC; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.nav-brand{display:flex; align-items:center; gap:11px; padding:20px var(--s4) 18px; border-bottom:1px solid rgba(255,255,255,.09)}
.nav-brand .logo{width:38px; color:#fff; flex:none}
.nav-brand .t1{font-size:12.5px; font-weight:800; letter-spacing:.16em; color:#fff; text-transform:uppercase}
.nav-brand .t2{font-size:10px; letter-spacing:.1em; color:#8FA6D8; text-transform:uppercase}
.nav-menu{flex:1; overflow-y:auto; padding:var(--s3) var(--s2)}
.nav-sec{padding:14px 12px 6px; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:#6E86BE}
.nav-item{
  display:flex; align-items:center; gap:11px; width:100%; padding:9px 12px; border-radius:8px;
  background:none; border:0; color:#C7D2EC; cursor:pointer; text-align:left; font-size:13.5px; font-weight:500;
  position:relative; transition:background .13s,color .13s;
}
.nav-item:hover{background:rgba(255,255,255,.07); color:#fff}
.nav-item.on{background:linear-gradient(90deg, rgba(22,119,255,.26), rgba(22,119,255,.06)); color:#fff; font-weight:600; box-shadow:inset 2px 0 0 var(--cyan), 0 0 18px rgba(0,217,255,.10)}
/* faceta: marcador em losango, eco do diamante da marca */
.nav-item.on::before{
  content:""; position:absolute; left:-8px; top:50%; width:7px; height:7px; background:var(--cyan);
  transform:translateY(-50%) rotate(45deg); border-radius:1px; box-shadow:0 0 8px var(--cyan);
}
.nav-item .ic{width:18px; flex:none; text-align:center; opacity:.9}
.nav-item .badge-n{margin-left:auto; background:var(--amber); color:#fff; font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:20px}
.nav-foot{padding:var(--s3) var(--s4) var(--s4); border-top:1px solid rgba(255,255,255,.09); font-size:12px}
.nav-user{display:flex; align-items:center; gap:10px; margin-bottom:10px; width:100%; background:none; border:0;
  padding:6px; border-radius:8px; cursor:pointer; text-align:left; transition:background .13s}
.nav-user:hover{background:rgba(255,255,255,.07)}
.avatar{width:30px; height:30px; border-radius:8px; background:var(--royal); color:#fff; display:grid; place-items:center; font-weight:700; font-size:12px; flex:none}
.nav-user .u1{color:#fff; font-weight:600; font-size:12.5px} .nav-user .u2{color:#8FA6D8; font-size:10.5px}
.link-out{background:none;border:0;color:#8FA6D8;cursor:pointer;font-size:12px;padding:0}
.link-out:hover{color:#fff}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  background:var(--surface); border-bottom:1px solid var(--line); padding:14px var(--s5);
  display:flex; align-items:center; gap:var(--s4); position:sticky; top:0; z-index:20;
}
.topbar .tt{flex:1; min-width:0}
.topbar .tt .eyebrow{margin-bottom:2px}
.topbar-actions{display:flex; gap:var(--s2); align-items:center; flex-wrap:wrap}
.content{padding:var(--s5); flex:1}
.menu-toggle{display:none}

/* --------------------------------------------------- cards / grids */
.card{background:linear-gradient(180deg, rgba(255,255,255,.02), transparent 40%), var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); transition:border-color .18s, box-shadow .18s}
.card:hover{border-color:var(--line-2)}

/* entrada suave do conteúdo — troca de tela e reaplicação de filtros */
.fx-in{animation:fxIn .4s cubic-bezier(.16,1,.3,1) both}
@keyframes fxIn{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
/* KPIs entram em cascata, um pouco depois um do outro */
.grid.kpis > .kpi{animation:fxIn .45s cubic-bezier(.16,1,.3,1) both}
.grid.kpis > .kpi:nth-child(1){animation-delay:.02s}
.grid.kpis > .kpi:nth-child(2){animation-delay:.07s}
.grid.kpis > .kpi:nth-child(3){animation-delay:.12s}
.grid.kpis > .kpi:nth-child(4){animation-delay:.17s}
.grid.kpis > .kpi:nth-child(5){animation-delay:.22s}
.grid.kpis > .kpi:nth-child(6){animation-delay:.27s}
.grid.kpis > .kpi:nth-child(n+7){animation-delay:.30s}
.card-h{display:flex; align-items:center; gap:var(--s3); padding:14px var(--s4); border-bottom:1px solid var(--line)}
.card-h h2{flex:1; min-width:0}
.card-b{padding:var(--s4)}
.grid{display:grid; gap:var(--s4)}
.kpis{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stack{display:flex; flex-direction:column; gap:var(--s4)}
.row{display:flex; gap:var(--s3); align-items:center; flex-wrap:wrap}
.spacer{flex:1}

/* KPI com faceta no canto (eco do diamante) */
.kpi{position:relative; overflow:hidden; padding:var(--s4)}
.kpi{transition:border-color .18s, box-shadow .18s, transform .18s}
.kpi:hover{border-color:var(--royal); box-shadow:var(--glow); transform:translateY(-3px)}
.kpi::after{
  content:""; position:absolute; top:-16px; right:-16px; width:34px; height:34px;
  background:var(--royal-50); transform:rotate(45deg);
}
.kpi .k-val{background:linear-gradient(180deg,#fff,#B7CCF0); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.kpi .k-lab{font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; position:relative}
.kpi .k-val{font-size:clamp(20px,1.85vw,26px); font-weight:800; letter-spacing:-.02em; line-height:1.1; color:var(--ink)}
.kpi .k-sub{font-size:12px; color:var(--muted); margin-top:5px}
.kpi.alert::after{background:var(--amber-bg)}
.kpi.alert .k-val{color:var(--amber)}

/* --------------------------------------------------- tabelas */
.tw{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; font-size:13px}
th{
  text-align:left; font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); padding:9px 12px; border-bottom:1px solid var(--line); background:var(--surface-2); white-space:nowrap;
}
th.sortable{cursor:pointer; user-select:none} th.sortable:hover{color:var(--royal)}
td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer} tbody tr.clickable:hover{background:var(--royal-50)}
.ta-r{text-align:right} .ta-c{text-align:center}
.tot-row td{font-weight:700; background:var(--surface-2); border-top:2px solid var(--line-2)}
.mono{font-variant-numeric:tabular-nums}
.strong{font-weight:600}
.dim{color:var(--muted)}
.nowrap{white-space:nowrap}

/* --------------------------------------------------- badges */
.badge{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:600; white-space:nowrap}
.b-green{background:var(--green-bg); color:var(--green)}
.b-blue{background:var(--royal-50); color:var(--royal-300)}
.b-amber{background:var(--amber-bg); color:var(--amber)}
.b-red{background:var(--red-bg); color:var(--red)}
.b-gray{background:rgba(255,255,255,.06); color:var(--muted)}
.chip{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:20px; border:1px solid var(--line-2); background:var(--surface); font-size:12.5px; cursor:pointer}
.chip.on{background:var(--royal); border-color:var(--royal); color:#fff; font-weight:600}
.chip-x{background:none;border:0;color:inherit;cursor:pointer;font-size:14px;line-height:1;padding:0;opacity:.7}

/* --------------------------------------------------- alertas */
.alert-box{display:flex; gap:12px; padding:13px var(--s4); border-radius:var(--r); border:1px solid var(--amber-line); background:var(--amber-bg); color:#FFD98A}
.alert-box .ic{font-size:17px; line-height:1.2}
.alert-box h3{color:var(--amber); font-size:13.5px; margin-bottom:3px}
.alert-box.info{background:var(--royal-50); border-color:var(--royal-100); color:var(--royal-300)}
.alert-box.info h3{color:var(--royal-300)}

/* --------------------------------------------------- formulário de OS */
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:var(--s4)}
.itens-tbl th:first-child, .itens-tbl td:first-child{width:78px}
.itens-tbl input,.itens-tbl select{width:100%; padding:8px 10px; border:1px solid var(--line-2); border-radius:7px}
.serv-ajuda{font-size:11.5px; margin-top:5px; min-height:1px}
.serv-ajuda:empty{display:none}
.perm-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:7px}
.perm-item{display:flex; align-items:center; gap:9px; padding:7px 10px; border:1px solid var(--line);
  border-radius:8px; font-size:12.5px; cursor:pointer; background:var(--surface)}
.perm-item:hover{border-color:var(--line-2); background:rgba(255,255,255,.04)}
.perm-item input{accent-color:var(--royal); width:15px; height:15px; flex:none}
.itens-tbl input:focus,.itens-tbl select:focus{outline:none;border-color:var(--royal);box-shadow:0 0 0 3px var(--royal-100)}
.total-bar{
  display:flex; align-items:center; justify-content:space-between; gap:var(--s4); flex-wrap:wrap;
  padding:var(--s4) var(--s5); border-radius:var(--r); color:#fff;
  background:linear-gradient(100deg,var(--royal-900),var(--royal));
}
.total-bar .lab{font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#B7C6EC}
.total-bar .val{font-size:31px; font-weight:800; letter-spacing:-.02em; line-height:1.1}
.total-bar .sub{font-size:12.5px; color:#B7C6EC}
.rm-btn{background:none; border:0; color:var(--muted); cursor:pointer; font-size:17px; padding:2px 6px; border-radius:6px; line-height:1}
.rm-btn:hover{background:var(--red-bg); color:var(--red)}
.link-cad{background:none; border:0; padding:0; color:var(--royal); font-weight:600; cursor:pointer; font-size:inherit; text-decoration:underline}
.link-cad:hover{color:var(--royal-800)}
.veic-row{display:flex; gap:var(--s2); align-items:center}
.veic-row .input{flex:1; min-width:0}
@media (max-width:560px){
  .veic-row{flex-wrap:wrap}
  .veic-row .input{flex:1 1 100%}
  .veic-row .btn{flex:1 1 100%}
}

/* --------------------------------------------------- timeline (assinatura) */
.tl{position:relative; padding-left:26px}
.tl::before{content:""; position:absolute; left:6px; top:8px; bottom:8px; width:2px; background:var(--line)}
.tl-item{position:relative; padding:0 0 var(--s4) 0}
.tl-item::before{
  content:""; position:absolute; left:-24px; top:5px; width:9px; height:9px; background:var(--surface);
  border:2px solid var(--royal); transform:rotate(45deg); border-radius:1px;
}
.tl-item.rec::before{border-color:var(--amber); background:var(--amber)}
.tl-d{font-size:11.5px; color:var(--muted); font-weight:600}
.tl-c{display:flex; gap:var(--s3); align-items:baseline; flex-wrap:wrap}
.tl-c .v{font-weight:700; margin-left:auto}

/* --------------------------------------------------- gráficos */
.chart{width:100%; overflow:visible}
.chart-v{max-height:264px}
.chart:not(.chart-v){max-height:420px}
.chart text{font-family:var(--sans); font-size:11px; fill:var(--ink-2)}
.chart .lbl-v{fill:var(--ink); font-weight:600}
.chart .gl{stroke:var(--line); stroke-width:1}
.bar{transition:opacity .13s, filter .13s} .bar:hover{opacity:1; filter:brightness(1.14)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:10px}
.legend i{width:10px; height:10px; border-radius:2px; display:inline-block; margin-right:5px}

/* barras crescem do zero até o valor real; linha é desenhada; pontos aparecem em cascata */
.chart .bar{transform-box:fill-box; transition:transform .8s cubic-bezier(.16,1,.3,1), opacity .13s, filter .13s;
  filter:drop-shadow(0 0 4px currentColor)}
.chart .bar:hover{filter:brightness(1.18) drop-shadow(0 0 8px currentColor)}
.chart .bar.fx-h{transform-origin:0% 50%}
.chart .bar.fx-v{transform-origin:50% 100%}
.chart .area-fx{opacity:0; animation:areaIn 1s ease .25s both}
@keyframes areaIn{to{opacity:1}}
.chart .linha-fx{filter:drop-shadow(0 0 5px currentColor)}
.chart .dot-fx{opacity:0; transform-box:fill-box; transform-origin:center; animation:dotIn .45s cubic-bezier(.34,1.56,.64,1) both;
  filter:drop-shadow(0 0 4px currentColor)}
@keyframes dotIn{from{opacity:0; transform:scale(0)}to{opacity:1; transform:scale(1)}}

/* gráfico "equalizador" — muitas colunas finas, brilho mais forte, ponto pulsante no período atual */
.chart .eq-bar{filter:drop-shadow(0 0 6px currentColor)}
.chart .eq-bar:hover{filter:brightness(1.3) drop-shadow(0 0 12px currentColor)}
.chart .eq-live{transform-box:fill-box; transform-origin:center; filter:drop-shadow(0 0 6px currentColor);
  animation:eqPulse 1.6s ease-in-out infinite}
@keyframes eqPulse{0%,100%{opacity:.55; transform:scale(1)}50%{opacity:1; transform:scale(1.4)}}

/* o brilho é um efeito do painel escuro — no papel branco do relatório (impressão/PDF) fica limpo, sem glow */
.report .chart .bar,.report .chart .bar:hover,.report .chart .linha-fx,.report .chart .dot-fx,.report .chart .donut-fx,
.report .chart .eq-bar,.report .chart .eq-bar:hover,.report .chart .eq-live{filter:none; animation:none}

/* --------------------------------------------------- modal / toast */
.modal-bg{position:fixed; inset:0; background:rgba(2,7,15,.68); backdrop-filter:blur(3px); display:grid; place-items:center; padding:var(--s4); z-index:100; animation:modalBgIn .18s ease both}
@keyframes modalBgIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface); border-radius:var(--r-lg); width:100%; max-width:720px; max-height:88vh; display:flex; flex-direction:column; box-shadow:var(--shadow-lg); animation:modalIn .24s cubic-bezier(.16,1,.3,1) both}
@keyframes modalIn{from{opacity:0; transform:translateY(10px) scale(.97)}to{opacity:1; transform:none}}
.modal-h{display:flex; align-items:center; gap:var(--s3); padding:var(--s4) var(--s5); border-bottom:1px solid var(--line)}
.modal-b{padding:var(--s5); overflow:auto}
.modal-f{padding:var(--s4) var(--s5); border-top:1px solid var(--line); display:flex; gap:var(--s2); justify-content:flex-end}
#toasts{position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:200}
.toast{background:var(--surface); color:var(--ink); border:1px solid var(--line-2); padding:11px 16px; border-radius:9px; box-shadow:var(--shadow-lg); font-size:13px; animation:tin .2s ease-out; display:flex; align-items:center}
.toast.ok{border-color:var(--green); color:var(--green)} .toast.warn{border-color:var(--amber); color:var(--amber)} .toast.err{border-color:var(--red); color:var(--red)}
@keyframes tin{from{opacity:0; transform:translateY(8px)}to{opacity:1;transform:none}}
.toast.load::before{content:""; width:12px; height:12px; margin-right:9px; border-radius:50%; flex:none;
  border:2px solid var(--line-2); border-top-color:var(--royal); animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* --------------------------------------------------- vazio */
.empty{text-align:center; padding:var(--s7) var(--s4); color:var(--muted)}
.empty .d{width:26px; height:26px; margin:0 auto var(--s3); background:var(--royal-100); transform:rotate(45deg); border-radius:3px}
.empty h3{color:var(--ink-2); margin-bottom:5px}

/* --------------------------------------------------- relatório */
/* relatório = documento em papel branco (impressão), texto sempre escuro */
.report{background:#fff; color:#0F172A; padding:var(--s6); border-radius:var(--r); border:1px solid var(--line); box-shadow:var(--shadow)}
.report h1,.report h2,.report h3,.report .rep-kpi .v{color:#0F172A}
.report .dim,.report .rep-kpi .l,.report .pd,.report .muted{color:#64748B}
.report th{background:#F8FAFC; color:#64748B}
.report .rep-kpi{background:#F8FAFC; border-color:#E2E8F0}
.report td,.report th{border-color:#E2E8F0}
.rep-head{display:flex; align-items:center; gap:var(--s4); border-bottom:3px solid var(--royal); padding-bottom:var(--s4); margin-bottom:var(--s5)}
.rep-head .logo{width:62px; color:var(--royal); flex:none}
.rep-head h1{font-size:19px; letter-spacing:-.01em}
.rep-head .co{font-size:11px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:var(--royal); margin-bottom:3px}
.rep-head .pd{font-size:12.5px; color:var(--muted); margin-top:3px}
.rep-sec{margin-top:var(--s5); break-inside:avoid}
.rep-sec > h2{display:flex; align-items:center; gap:9px; margin-bottom:var(--s3); font-size:14px}
.rep-sec > h2::before{content:""; width:8px; height:8px; background:var(--royal); transform:rotate(45deg); border-radius:1px; flex:none}
.rep-kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:var(--s3)}
.rep-kpi{border:1px solid var(--line); border-left:3px solid var(--royal); border-radius:9px; padding:var(--s3) var(--s4); background:#F8FAFC;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease}
.rep-kpi:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(15,23,42,.10); border-color:#CBD5E1}
.rep-kpi .l{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.rep-kpi .v{font-size:21px; font-weight:800; margin-top:3px}

/* gráficos legíveis dentro do papel branco do relatório (o app é escuro por padrão) */
.report .chart text{fill:#64748B}
.report .chart .lbl-v{fill:#0F172A}
.report .chart .gl{stroke:#E2E8F0}
.report .tot-row td{background:#EEF2FF; color:#0F172A; border-top:2px solid var(--royal)}

/* destaque de atenção dentro do relatório (ex.: reincidências) */
.rep-flag{border-left:3px solid var(--amber); background:#FFFBEB; color:#78350F; border-radius:8px; padding:10px 14px; margin-bottom:var(--s3); font-size:13px}
.rep-flag strong{color:#92400E}

/* rosca (donut) de composição */
.donut-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:var(--s5)}
.donut-wrap{display:flex; flex-direction:column; align-items:center; gap:10px; padding:4px 0}
.chart.donut{width:184px; height:184px; max-height:184px; overflow:visible; flex:none}
.chart .donut-fx{transition:stroke-width .15s ease}
.chart .donut-fx:hover{stroke-width:31}
.donut-wrap .legend{justify-content:center; text-align:left}

@media print{
  :root{color-scheme:light; --ink:#0F172A; --ink-2:#1E293B; --muted:#64748B; --muted-2:#94A3B8;
        --line:#E2E8F0; --line-2:#CBD5E1; --surface:#fff; --surface-2:#F8FAFC; --canvas:#fff}
  body{background:#fff; color:#0F172A}
  .card{background:#fff}
  .nav,.topbar,.no-print{display:none !important}
  #app{grid-template-columns:1fr}
  .content{padding:0}
  .report{border:0; box-shadow:none; padding:0; border-radius:0}
  .card{box-shadow:none}
  table{font-size:10.5px} td,th{padding:5px 7px}
  .rep-sec{page-break-inside:avoid}
  @page{margin:14mm}
  /* impressão nunca deve pegar o gráfico/KPI em meio à animação de entrada */
  .fx-in,.kpi,.chart .bar,.chart .area-fx,.chart .dot-fx{animation:none !important; opacity:1 !important; transform:none !important}
  .chart .linha-fx,.chart .donut-fx{stroke-dashoffset:0 !important; transition:none !important}
}

/* --------------------------------------------------- responsivo */
@media (max-width:1024px){
  #app{grid-template-columns:1fr}
  .nav{position:fixed; left:0; top:0; z-index:60; width:var(--nav-w); transform:translateX(-100%); transition:transform .22s ease}
  .nav.open{transform:none; box-shadow:var(--shadow-lg)}
  .menu-toggle{display:inline-flex}
  .nav-scrim{position:fixed; inset:0; background:rgba(12,31,85,.45); z-index:50}
}
@media (max-width:640px){
  .content{padding:var(--s4) var(--s3) 96px}
  .topbar{padding:11px var(--s3)}
  h1{font-size:18px}
  .kpi .k-val{font-size:23px}
  .total-bar{position:sticky; bottom:0; z-index:15; box-shadow:0 -6px 18px rgba(12,31,85,.18)}
  .total-bar .val{font-size:26px}
  .modal{max-height:94vh}
  .modal-b{padding:var(--s4)}
  /* tabela de itens vira cartões no celular */
  .itens-tbl thead{display:none}
  .itens-tbl tr{display:grid; grid-template-columns:1fr 1fr; gap:9px; padding:12px; border-bottom:1px solid var(--line); position:relative}
  .itens-tbl td{display:block; border:0; padding:0}
  .itens-tbl td[data-l]::before{content:attr(data-l); display:block; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:3px}
  .itens-tbl td.serv{grid-column:1/-1}
  .itens-tbl td.act{position:absolute; top:10px; right:8px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important}}

/* --------------------------------------------------- lista de passos */
.lista-passos{margin:var(--s3) 0 0; padding-left:20px; display:flex; flex-direction:column; gap:6px}
.lista-passos li{font-size:13.5px; line-height:1.55}
.login-foot .versao{display:block; margin-top:4px; font-size:10.5px; letter-spacing:.04em; opacity:.6}

/* --------------------------------------------------- auditoria da OS */
.audit-line{margin-top:var(--s4); padding-top:var(--s3); border-top:1px dashed var(--line-2); font-size:12px; color:var(--muted)}
.audit-line strong{color:var(--ink-2); font-weight:600}

/* --------------------------------------------------- tabela dentro do aviso de reincidência */
.alert-box .reinc-tbl{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; overflow:hidden}
.alert-box .reinc-tbl th{background:transparent; color:var(--muted); border-bottom:1px solid var(--line)}
.alert-box .reinc-tbl td{color:var(--ink-2); border-bottom:1px solid var(--line)}
.alert-box .reinc-tbl tbody tr:last-child td{border-bottom:0}
.alert-box .reinc-tbl td strong{color:var(--ink)}
.alert-box .reinc-tbl .dim{color:var(--muted)}

/* --------------------------------------------------- seleção de texto legível no tema escuro */
::selection{background:rgba(22,119,255,.40); color:#fff}
::-moz-selection{background:rgba(22,119,255,.40); color:#fff}

/* --------------------------------------------------- animação de entrada (login → sistema) */
#entrada-anim{
  position:fixed; inset:0; z-index:9999; display:grid; place-items:center; overflow:hidden; pointer-events:none;
  background:radial-gradient(circle at 50% 44%, #0B1E3A 0%, #060A12 62%, #05070C 100%);
  animation:ea-bgin .34s ease both;
}
#entrada-anim.ea-out{animation:ea-bgout .6s ease forwards}
.ea-stage{position:absolute; inset:0; display:grid; place-items:center}
.ea-stage > *{grid-area:1/1}                     /* logo, halo e partículas empilhados no centro */
.ea-logo{
  width:clamp(104px,20vw,168px); color:#fff; will-change:transform,opacity,filter;
  animation:ea-grow 2.6s cubic-bezier(.22,.61,.36,1) both;
}
.ea-logo svg{display:block; width:100%; height:auto; fill:#fff}
.ea-part{
  width:3px; height:3px; border-radius:50%; background:#fff; opacity:0; will-change:transform,opacity;
  box-shadow:0 0 6px rgba(255,255,255,.85); animation:ea-spark 1.7s ease-out both;
}
@keyframes ea-bgin{from{opacity:0}to{opacity:1}}
@keyframes ea-bgout{from{opacity:1}to{opacity:0}}
/* brilho segue o contorno da logo (drop-shadow em camadas), não um círculo */
@keyframes ea-grow{
  0%{transform:scale(.34); opacity:0;
     filter:drop-shadow(0 0 0 rgba(255,255,255,0))}
  22%{opacity:1}
  58%{transform:scale(1); opacity:1;
     filter:drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 16px rgba(255,255,255,.5))}
  76%{transform:scale(1.06); opacity:1;
     filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 26px rgba(255,255,255,.85)) drop-shadow(0 0 48px rgba(255,255,255,.5))}
  84%{transform:scale(1.015); opacity:1;
     filter:drop-shadow(0 0 7px #fff) drop-shadow(0 0 18px rgba(255,255,255,.6)) drop-shadow(0 0 34px rgba(255,255,255,.35))}
  92%{transform:scale(1.05); opacity:1;
     filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 30px rgba(255,255,255,.8)) drop-shadow(0 0 54px rgba(255,255,255,.45))}
  100%{transform:scale(1.12); opacity:0;
     filter:drop-shadow(0 0 20px rgba(255,255,255,0))}
}
@keyframes ea-spark{
  0%{opacity:0; transform:translate(0,0) scale(.4)} 30%{opacity:.9}
  100%{opacity:0; transform:translate(var(--x),var(--y)) scale(1)}
}
@media (prefers-reduced-motion:reduce){
  #entrada-anim{animation:ea-bgin .2s ease both}
  .ea-logo,.ea-part{animation:none}
  .ea-logo{opacity:1; transform:none; filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 22px rgba(255,255,255,.5))}
}

</style>

const Fmt = (() => {

})();

const Dt = (() => {
  const today = () => new Date().toISOString().slice(0, 10);
  const d = iso => { const [y, m, dd] = iso.split('-').map(Number); return new Date(y, m - 1, dd); };
  const iso = dt => [dt.getFullYear(), String(dt.getMonth() + 1).padStart(2, '0'), String(dt.getDate()).padStart(2, '0')].join('-');
  const add = (i, n) => { const x = d(i); x.setDate(x.getDate() + n); return iso(x); };
  const diff = (a, b) => Math.round((d(a) - d(b)) / 86400000);
  const weekStart = i => { const x = d(i); const w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); return iso(x); };  // segunda
  const monthStart = i => i.slice(0, 8) + '01';
  const monthEnd = i => { const x = d(i); return iso(new Date(x.getFullYear(), x.getMonth() + 1, 0)); };
  const DIAS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  const agora = () => { const x = new Date(), p = n => String(n).padStart(2, '0'); return { data: iso(x), hora: p(x.getHours()) + ':' + p(x.getMinutes()) }; };
  return { today, agora, add, diff, weekStart, monthStart, monthEnd, iso, d, diaSemana: i => DIAS[d(i).getDay()] };
})();

/* ---------- Rec: grupos de problema e reincidência ---------- */
const Rec = (() => {
  // Cada serviço é classificado em um sistema do veículo. É o que permite dizer
  // "este veículo voltou pelo mesmo problema".
  const GRUPOS = [
    { id: 'freios', nome: 'Freios', rx: /freio|pastilha|sapat|sapad|campana|lona|pin[çc]a|sangria|cilindro.*freio|disco/i },
    { id: 'ar', nome: 'Ar Condicionado', rx: /ar.?cond|g[áa]s|compres|evaporador|nitrog|h[ie]gieniz|condensador|intercule|intercooler|\bar\b/i },
    { id: 'suspensao', nome: 'Suspensão e Molejo', rx: /amortec|bieleta|molejo|mola|estabilizador|batente|jumelo|bande?ja|bandja|bucha|feixe|balan[çc]a|peito de a[çc]o/i },
    { id: 'direcao', nome: 'Direção', rx: /dire[çc][ãa]o|terminal|axial|pivo|piv[ôo]|caixa.*dire|barra/i },
    { id: 'transmissao', nome: 'Transmissão e Tração', rx: /embreagem|c[âa]mbio|cardan|carda|cruzeta|diferencial|semi.?eixo|coifa|homocin|transfer|cubo|rolamento|tra[çc][ãa]o|quinta roda|catraca|mancal|garfo/i },
    { id: 'motor', nome: 'Motor', rx: /motor|bico|bomba|turbina|corre[ia]|coxim|junta|cabe[çc]ote|velas|tanque|combust/i },
    { id: 'arrefecimento', nome: 'Arrefecimento', rx: /radiador|arrefec|reservat[óo]rio|reserv\.agua|ventila|mangueira/i },
    { id: 'eletrica', nome: 'Elétrica', rx: /el[ée]tric|el[ée]tro|l[âa]mpada|lampada|alternador|partida|bateria|scan[en]er|scaner|aparelho|farol|lanterna|lant\.|lente|fecha|vidro|painel|cabo/i },
    { id: 'pneus', nome: 'Pneus e Rodas', rx: /pneu|roda|remend|calibr/i },
    { id: 'estrutura', nome: 'Estrutura e Solda', rx: /solda|chassis|carro[çc]|carroceria|ca[çc]amba|para.?barro|parabarro|respig|retrovisor|estirante|guincho|engate|carreta|cabine|gabine|dolly/i },
    { id: 'gerais', nome: 'Serviços Gerais e Obras', rx: /pintura|almoxarif|escrit[óo]rio|encanament|p[ao]rtilheira|prateleira|adapta[çc]|montagem|serv\.? ?gerais|concha|faca|bitorneira|caixa d'agua|m[ãa]o de obra|porta/i, rotina: true },
    { id: 'rotina', nome: 'Revisão e Lubrificação', rx: /engraxamento|[óoée]l[ée]?o|oleo|filtro|revis|palheta|lavagem|limpeza|ajuste|regulagem|desloc|socorro|posi[çc][ãa]o|atf/i, rotina: true },
  ];
  const OUTROS = { id: 'outros', nome: 'Outros', rx: null };

  function grupoDe(desc) {
    const s = String(desc || '');
    for (const g of GRUPOS) if (g.rx.test(s)) return g;
    return OUTROS;
  }
  const gruposDaOS = os => [...new Set((os.itens || []).map(i => grupoDe(i.descricao).id))];
  const nomeGrupo = id => (GRUPOS.find(g => g.id === id) || OUTROS).nome;
  const ehRotina = id => !!(GRUPOS.find(g => g.id === id) || {}).rotina;

  /** Ocorrências anteriores do mesmo sistema no mesmo veículo. */
  function anteriores(os, todas, janelaDias) {
    if (!os.data || !os.veiculoId) return [];
    const gs = gruposDaOS(os).filter(g => !ehRotina(g));
    if (!gs.length) return [];
    const out = [];
    for (const o of todas) {
      if (o === os || o.id === os.id || !o.data) continue;
      if (o.veiculoId !== os.veiculoId) continue;
      if (o.data > os.data || (o.data === os.data && (o.numero || 0) >= (os.numero || 0))) continue;
      const dias = Dt.diff(os.data, o.data);
      if (dias > janelaDias) continue;
      const comuns = gruposDaOS(o).filter(g => gs.includes(g));
      if (!comuns.length) continue;
      out.push({ os: o, dias, grupos: comuns });
    }
    return out.sort((a, b) => a.dias - b.dias);
  }
  return { GRUPOS: GRUPOS.concat([OUTROS]), grupoDe, gruposDaOS, nomeGrupo, ehRotina, anteriores };
})();

    { id: 'config', nome: 'Alterar configurações do sistema', grupo: 'Administrar' },
    { id: 'usuarios', nome: 'Gerenciar usuários e acessos', grupo: 'Administrar' },
  ];
  const TODAS = LISTA.map(p => p.id);

  const PERFIS = {
    'Administrador': { desc: 'Acesso total, incluindo usuários e configurações.', perms: TODAS.slice() },
    'Gestor': {
      desc: 'Opera e analisa tudo, sem gerenciar usuários.',
      perms: ['dashboard', 'os.ver', 'veiculos.ver', 'servicos.ver', 'relatorios.ver', 'reincidencias.ver',
        'os.criar', 'os.editar', 'os.excluir', 'veiculos.editar', 'servicos.editar', 'exportar', 'importar']
    },
    'Mecânico': {
      desc: 'Registra OS e consulta veículos e serviços. Sem relatórios nem exclusões.',
      perms: ['os.ver', 'veiculos.ver', 'servicos.ver', 'os.criar', 'os.editar', 'veiculos.editar', 'servicos.editar']
    },
    'Diretoria': {
      desc: 'Somente leitura: dashboard, relatórios e reincidências.',
      perms: ['dashboard', 'os.ver', 'veiculos.ver', 'servicos.ver', 'relatorios.ver', 'reincidencias.ver', 'exportar']
    },
  };
  const nomesPerfis = () => Object.keys(PERFIS);
  const doPerfil = perfil => (PERFIS[perfil] || PERFIS['Mecânico']).perms.slice();

  /** O usuário logado pode fazer isso? */
  function pode(chave) {
    const u = Estado.usuario;
    if (!u) return false;
    if (u.perfil === 'Administrador') return true;
    // Regra fixa: Mecânico nunca vê o dashboard, mesmo que alguém marque
    // a permissão manualmente na ficha do usuário (perfil personalizado).
    if (chave === 'dashboard' && u.perfil === 'Mecânico') return false;
    return (u.permissoes || []).includes(chave);
  }
  const nome = id => (LISTA.find(p => p.id === id) || {}).nome || id;
  return { LISTA, TODAS, PERFIS, nomesPerfis, doPerfil, pode, nome };
})();

/* ---------- DB: base de dados (planilha + localStorage) ---------- */
const DB = (() => {
  const KEY = 'brilhante_os_v1';
  const EQUIPE_VERSAO = 2;      // aumentar aqui quando novos usuários entrarem de fábrica
  let d = null;

  const semente = () => {
    const p = JSON.parse(JSON.stringify(window.DADOS_PLANILHA));
    p.ordens.forEach((o, i) => { o.id = 'P' + (i + 1); });
    p.veiculos.forEach(v => { v.ano = v.ano || ''; v.status = v.status || 'Ativo'; v.kmAtual = null; });
    // último KM/H conhecido por veículo
    p.ordens.forEach(o => {
      if (o.kmH == null) return;
      const v = p.veiculos.find(x => x.id === o.veiculoId);
      if (v && (v.kmAtual == null || (o.data || '') >= (v.kmAtualData || ''))) { v.kmAtual = o.kmH; v.kmAtualData = o.data; }
    });
    p.config = { janelaReincidencia: 90, alertaOSmes: 3 };
    p.usuarios = EQUIPE.map(novoUsuarioPadrao);
    p.equipeVersao = EQUIPE_VERSAO;
    p.versao = 1;
    return p;
  };

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        d = JSON.parse(raw);
        if (!d.config) d.config = semente().config;
        migrar();
        return d;
      }
    } catch (e) { console.warn('localStorage indisponível, usando memória.', e); }
    d = semente();
    save();
    return d;
  }
  /** Bases criadas antes do módulo de usuários continuam funcionando. */
  function migrar() {
    if (!Array.isArray(d.usuarios) || !d.usuarios.length) {
      d.usuarios = [{
        id: 'U1', nome: d.config.usuario || 'Kamau', usuario: d.config.usuario || 'Kamau',
        senha: d.config.senha || '159753', perfil: 'Administrador', permissoes: Perm.doPerfil('Administrador'),
        status: 'Ativo', setor: 'Compras', criadoEm: Dt.today(), ultimoAcesso: ''
      }];
      delete d.config.usuario; delete d.config.senha;
      save();
    }
    d.usuarios.forEach(u => { if (!Array.isArray(u.permissoes)) u.permissoes = Perm.doPerfil(u.perfil); });
    // Mecânico nunca deve ter a permissão de dashboard salva na ficha (mesmo que
    // tenha sido marcada manualmente antes desta regra existir). Perm.pode() já
    // bloqueia isso na prática, mas aqui a ficha do usuário fica consistente
    // com o que ele realmente pode fazer.
    let limpouPerm = false;
    d.usuarios.forEach(u => {
      if (u.perfil === 'Mecânico' && Array.isArray(u.permissoes) && u.permissoes.includes('dashboard')) {
        u.permissoes = u.permissoes.filter(p => p !== 'dashboard');
        limpouPerm = true;
      }
    });
    if (limpouPerm) save();
    // Equipe de fábrica: entra uma única vez em bases antigas, sem tocar em quem já existe
    // nem ressuscitar quem o administrador excluiu depois.
    if ((d.equipeVersao || 0) < EQUIPE_VERSAO) {
      const tem = l => d.usuarios.some(u => String(u.usuario).trim().toLowerCase() === l.toLowerCase());
      const ids = new Set(d.usuarios.map(u => u.id));
      EQUIPE.forEach(e => {
        if (tem(e.usuario)) return;
        const novo = novoUsuarioPadrao(e);
        if (ids.has(novo.id)) novo.id = 'U' + e.usuario.toUpperCase();
        d.usuarios.push(novo); ids.add(novo.id);
      });
      d.equipeVersao = EQUIPE_VERSAO;
      save();
    }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(d)); return true; }
    catch (e) { console.warn('Não foi possível gravar localmente.', e); return false; }
  }
  const get = () => d || load();

  const veiculo = id => get().veiculos.find(v => v.id === id) || null;
  const servico = cod => get().servicos.find(s => s.codigo === cod) || null;
  const nomeVeiculo = id => { const v = veiculo(id); return v ? v.nome : '—'; };
  const rotuloVeiculo = id => { const v = veiculo(id); return v ? v.nome + (v.placa !== '—' ? ' · ' + v.placa : '') : '—'; };

  function proximoNumero() { return get().ordens.reduce((m, o) => Math.max(m, o.numero || 0), 0) + 1; }

  function salvarOS(os) {
    const b = get();
    // Carimbo de auditoria: quem registrou/alterou e quando (não editável pelo usuário).
    const quem = (typeof Estado !== 'undefined' && Estado.usuario) ? (Estado.usuario.nome || Estado.usuario.usuario) : '';
    const ag = Dt.agora();
    if (os.id && b.ordens.some(o => o.id === os.id)) {
      os.alteradoPor = quem; os.alteradoData = ag.data; os.alteradoHora = ag.hora;   // preserva a criação original
      const i = b.ordens.findIndex(o => o.id === os.id);
      b.ordens[i] = os;
    } else {
      os.id = 'OS' + Date.now().toString(36).toUpperCase();
      os.numero = proximoNumero();
      os.criadoPor = quem; os.criadoData = ag.data; os.criadoHora = ag.hora;
      delete os.alteradoPor; delete os.alteradoData; delete os.alteradoHora;
      b.ordens.push(os);
    }
    // atualiza KM/H do veículo e cadastros auxiliares
    const v = veiculo(os.veiculoId);
    if (v && os.kmH != null && (v.kmAtual == null || os.kmH >= v.kmAtual)) { v.kmAtual = os.kmH; v.kmAtualData = os.data; }
    if (os.local && !b.locais.includes(os.local)) b.locais.push(os.local), b.locais.sort();
    if (os.condutor && !b.condutores.includes(os.condutor)) b.condutores.push(os.condutor), b.condutores.sort();
    if (os.mecanico && !b.mecanicos.includes(os.mecanico)) b.mecanicos.push(os.mecanico), b.mecanicos.sort();
    save();
    return os;
  }
  function excluirOS(id) { const b = get(); b.ordens = b.ordens.filter(o => o.id !== id); save(); }
  function salvarVeiculo(v) {
    const b = get(); const i = b.veiculos.findIndex(x => x.id === v.id);
    if (i >= 0) b.veiculos[i] = v; else b.veiculos.push(v);
    save(); return v;
  }
  function salvarServico(s) {
    const b = get(); const i = b.servicos.findIndex(x => x.codigo === s.codigo);
    if (i >= 0) b.servicos[i] = s;
    else { s.codigo = s.codigo || 'SV' + String(b.servicos.length + 1).padStart(3, '0'); b.servicos.push(s); }
    save(); return s;
  }
  const usuarios = () => get().usuarios || [];
  const usuarioPorLogin = login => usuarios().find(u =>
    String(u.usuario).trim().toLowerCase() === String(login).trim().toLowerCase()) || null;

  function salvarUsuario(u) {
    const b = get();
    if (!u.id) { u.id = 'U' + Date.now().toString(36).toUpperCase(); u.criadoEm = Dt.today(); b.usuarios.push(u); }
    else { const i = b.usuarios.findIndex(x => x.id === u.id); if (i >= 0) b.usuarios[i] = u; else b.usuarios.push(u); }
    save(); return u;
  }
  function excluirUsuario(id) {
    const b = get();
    const admins = b.usuarios.filter(u => u.perfil === 'Administrador' && u.status === 'Ativo');
    const alvo = b.usuarios.find(u => u.id === id);
    if (alvo && alvo.perfil === 'Administrador' && admins.length <= 1) return false;   // nunca ficar sem admin
    b.usuarios = b.usuarios.filter(u => u.id !== id);
    save(); return true;
  }

  function restaurar() { try { localStorage.removeItem(KEY); } catch (e) { } d = null; return load(); }
  function exportarJSON() { return JSON.stringify(get(), null, 1); }

  /* ---------- Backup: leitura, conferência e importação ----------
     Serve para levar a base de um computador (ou do arquivo local) para o
     sistema publicado na internet, que começa vazio em cada navegador.      */
  const assinaturaOS = o => [o.data || '', o.veiculoId || '', o.mecanico || '',
  Math.round((o.total || 0) * 100), (o.itens || []).length].join('|');

  function lerBackup(texto) {
    let b; try { b = JSON.parse(texto); } catch (e) { throw new Error('O arquivo não é um backup válido (.json).'); }
    if (!b || !Array.isArray(b.ordens) || !Array.isArray(b.veiculos) || !Array.isArray(b.servicos))
      throw new Error('O arquivo não tem a estrutura de um backup do sistema.');
    return b;
  }
  /** O que existe no arquivo e o que dele ainda não está na base atual. */
  function conferirBackup(b) {
    const at = get();
    const sig = new Set(at.ordens.map(assinaturaOS));
    const ids = new Set(at.ordens.map(o => o.id));
    const novasOS = b.ordens.filter(o => !ids.has(o.id) && !sig.has(assinaturaOS(o)));
    const placas = new Set(at.veiculos.map(v => (v.placa || '') + '|' + v.nome));
    const cods = new Set(at.servicos.map(s => s.codigo));
    const logins = new Set(at.usuarios.map(u => String(u.usuario).toLowerCase()));
    return {
      arquivo: {
        ordens: b.ordens.length, veiculos: b.veiculos.length, servicos: b.servicos.length,
        usuarios: (b.usuarios || []).length, total: b.ordens.reduce((s, o) => s + (o.total || 0), 0)
      },
      atual: {
        ordens: at.ordens.length, veiculos: at.veiculos.length, servicos: at.servicos.length,
        usuarios: at.usuarios.length, total: at.ordens.reduce((s, o) => s + (o.total || 0), 0)
      },
      novas: {
        ordens: novasOS.length,
        veiculos: b.veiculos.filter(v => !placas.has((v.placa || '') + '|' + v.nome)).length,
        servicos: b.servicos.filter(s => !cods.has(s.codigo)).length,
        usuarios: (b.usuarios || []).filter(u => !logins.has(String(u.usuario).toLowerCase())).length
      }
    };
  }
  /** modo: 'substituir' troca a base inteira · 'mesclar' só acrescenta o que falta. */
  function importarBackup(b, modo) {
    if (modo === 'substituir') {
      d = JSON.parse(JSON.stringify(b));
      if (!d.config) d.config = { janelaReincidencia: 90, alertaOSmes: 3 };
      if (!Array.isArray(d.usuarios) || !d.usuarios.length) d.usuarios = EQUIPE.map(novoUsuarioPadrao);
      migrar(); save();
      return { modo, ordens: d.ordens.length, veiculos: d.veiculos.length, servicos: d.servicos.length, usuarios: d.usuarios.length };
    }
    const at = get(), r = { modo, ordens: 0, veiculos: 0, servicos: 0, usuarios: 0 };
    const cods = new Set(at.servicos.map(s => s.codigo));
    b.servicos.forEach(s => { if (!cods.has(s.codigo)) { at.servicos.push(s); cods.add(s.codigo); r.servicos++; } });

    const chaveV = v => (v.placa || '') + '|' + v.nome;
    const mapaV = new Map(at.veiculos.map(v => [chaveV(v), v]));
    const deParaV = {};                                   // id do backup → id daqui
    b.veiculos.forEach(v => {
      const igual = mapaV.get(chaveV(v));
      if (igual) {                                        // completa os campos que faltam aqui
        deParaV[v.id] = igual.id;
        ['frota', 'local', 'condutor', 'marca', 'modelo', 'ano'].forEach(k => {
          if ((igual[k] == null || igual[k] === '' || igual[k] === '—') && v[k] && v[k] !== '—') igual[k] = v[k];
        });
      } else {
        const novo = JSON.parse(JSON.stringify(v));
        if (at.veiculos.some(x => x.id === novo.id)) novo.id = 'V' + Date.now().toString(36).toUpperCase() + r.veiculos;
        deParaV[v.id] = novo.id; at.veiculos.push(novo); mapaV.set(chaveV(novo), novo); r.veiculos++;
      }
    });
    const sig = new Set(at.ordens.map(assinaturaOS));
    const idsOS = new Set(at.ordens.map(o => o.id));
    let num = proximoNumero();
    b.ordens.forEach(o => {
      const c = JSON.parse(JSON.stringify(o));
      c.veiculoId = deParaV[c.veiculoId] || c.veiculoId;
      if (idsOS.has(c.id) || sig.has(assinaturaOS(c))) return;
      c.id = 'OS' + Date.now().toString(36).toUpperCase() + r.ordens;
      c.numero = num++;
      at.ordens.push(c); idsOS.add(c.id); sig.add(assinaturaOS(c)); r.ordens++;
    });
    const logins = new Set(at.usuarios.map(u => String(u.usuario).toLowerCase()));
    (b.usuarios || []).forEach(u => {
      if (logins.has(String(u.usuario).toLowerCase())) return;
      const c = JSON.parse(JSON.stringify(u));
      if (at.usuarios.some(x => x.id === c.id)) c.id = 'U' + Date.now().toString(36).toUpperCase() + r.usuarios;
      at.usuarios.push(c); logins.add(String(c.usuario).toLowerCase()); r.usuarios++;
    });
    ['locais', 'condutores', 'mecanicos'].forEach(k => {
      (b[k] || []).forEach(x => { if (x && !at[k].includes(x)) at[k].push(x); });
      at[k].sort();
    });
    save();
    return r;
  }

  return {
    get, load, save, veiculo, servico, nomeVeiculo, rotuloVeiculo, salvarOS, excluirOS,
    salvarVeiculo, salvarServico, proximoNumero, restaurar, exportarJSON,
    lerBackup, conferirBackup, importarBackup,
    usuarios, usuarioPorLogin, salvarUsuario, excluirUsuario,
    cfg: () => get().config,
  };
})();

/* ---------- Filtro de período ---------- */
const Periodo = (() => {
  const opcoes = [
    { id: 'tudo', nome: 'Todo o período' },
    { id: 'hoje', nome: 'Hoje' },
    { id: 'ontem', nome: 'Ontem' },
    { id: 'semana', nome: 'Esta semana' },
    { id: 'semana-1', nome: 'Semana passada' },
    { id: 'mes', nome: 'Este mês' },
    { id: 'mes-1', nome: 'Mês passado' },
    { id: 'custom', nome: 'Personalizado' },
  ];
  function faixa(id, de, ate) {
    const h = Dt.today();
    switch (id) {
      case 'hoje': return [h, h];
      case 'ontem': return [Dt.add(h, -1), Dt.add(h, -1)];
      case 'semana': { const s = Dt.weekStart(h); return [s, Dt.add(s, 6)]; }
      case 'semana-1': { const s = Dt.add(Dt.weekStart(h), -7); return [s, Dt.add(s, 6)]; }
      case 'mes': return [Dt.monthStart(h), Dt.monthEnd(h)];
      case 'mes-1': { const m = Dt.add(Dt.monthStart(h), -1); return [Dt.monthStart(m), Dt.monthEnd(m)]; }
      case 'custom': return [de || '2000-01-01', ate || h];
      default: return ['1900-01-01', '2999-12-31'];
    }
  }
  return { opcoes, faixa };
})();

/* ---------- Consultas agregadas ---------- */
const Q = (() => {
  function filtrar(f) {
    const b = DB.get();
    const [de, ate] = Periodo.faixa(f.periodo, f.de, f.ate);
    return b.ordens.filter(o => {
      if (f.periodo !== 'tudo') { if (!o.data) return false; if (o.data < de || o.data > ate) return false; }
      if (f.local && o.local !== f.local) return false;
      if (f.veiculo && o.veiculoId !== f.veiculo) return false;
      if (f.frota && o.frota !== f.frota) return false;
      if (f.mecanico && o.mecanico !== f.mecanico) return false;
      if (f.grupo && !Rec.gruposDaOS(o).includes(f.grupo)) return false;
      if (f.status && o.status !== f.status) return false;
      if (f.busca) {
        const t = (o.numero + ' ' + DB.rotuloVeiculo(o.veiculoId) + ' ' + o.placa + ' ' + o.frota + ' ' + o.local + ' ' +
          o.condutor + ' ' + o.mecanico + ' ' + (o.obs || '') + ' ' + o.itens.map(i => i.descricao).join(' ')).toLowerCase();
        if (!t.includes(f.busca.toLowerCase())) return false;
      }
      return true;
    });
  }
  const soma = os => os.reduce((s, o) => s + (o.total || 0), 0);
  const qtdItens = os => os.reduce((s, o) => s + o.itens.reduce((a, i) => a + (i.qtd || 1), 0), 0);

  function porChave(os, fn) {
    const m = new Map();
    os.forEach(o => {
      const k = fn(o); if (k == null || k === '') return;
      const e = m.get(k) || { chave: k, qtd: 0, valor: 0, veic: new Set() };
      e.qtd++; e.valor += o.total || 0; e.veic.add(o.veiculoId); m.set(k, e);
    });
    return [...m.values()].sort((a, b) => b.valor - a.valor);
  }
  function porGrupoServico(os) {
    const m = new Map();
    os.forEach(o => o.itens.forEach(i => {
      const g = Rec.grupoDe(i.descricao);
      const e = m.get(g.id) || { chave: g.id, nome: g.nome, qtd: 0, valor: 0 };
      e.qtd += (i.qtd || 1); e.valor += i.total || 0; m.set(g.id, e);
    }));
    return [...m.values()].sort((a, b) => b.valor - a.valor);
  }
  function porSemana(os) {
    const m = new Map();
    os.filter(o => o.data).forEach(o => {
      const k = Dt.weekStart(o.data);
      const e = m.get(k) || { chave: k, qtd: 0, valor: 0 };
      e.qtd++; e.valor += o.total || 0; m.set(k, e);
    });
    return [...m.values()].sort((a, b) => a.chave.localeCompare(b.chave));
  }
  /** OS do conjunto que possuem ocorrência anterior do mesmo sistema. */
  function reincidencias(os, todas) {
    const j = DB.cfg().janelaReincidencia;
    const base = todas || DB.get().ordens;
    const out = [];
    os.forEach(o => {
      const ant = Rec.anteriores(o, base, j);
      if (ant.length) out.push({ os: o, anterior: ant[0], todas: ant });
    });
    return out;
  }
  return { filtrar, soma, qtdItens, porChave, porGrupoServico, porSemana, reincidencias };
})();


/* ============================================================
   COMPONENTES — gráficos SVG, tabelas, modais e avisos
   ============================================================ */

/* ---------- Chart: gráficos SVG sem dependências ---------- */
const Chart = (() => {
  // Série única = magnitude → uma cor só (a cor segue a entidade, nunca o ranking).
  const AZUL = '#3157CE', AMBAR = '#C2721A', TRILHO = '#EEF2FF', CIANO = '#00D9FF';
  const CAT = ['#3157CE', '#0D9488', '#C2721A', '#8B5CF6', '#0891B2', '#BE123C'];
  // Família azul/ciano "command center" — para telas que pedem um visual monocromático com brilho
  // (ex.: dashboard), em vez do arco-íris categórico do CAT acima.
  const TONS_CIANO = ['#1677FF', '#00D9FF', '#5AA0FF', '#0B50BE', '#7DEEFF', '#0E63E6'];
  function corCiano(chave) {
    const s = String(chave || '');
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return TONS_CIANO[h % TONS_CIANO.length];
  }
  let tip;
  function tooltip() {
    if (!tip) {
      tip = document.createElement('div');
      tip.style.cssText = 'position:fixed;z-index:300;background:#0F172A;color:#fff;padding:7px 11px;' +
        'border-radius:7px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .1s;' +
        'box-shadow:0 4px 12px rgba(15,23,42,.25);max-width:230px;font-variant-numeric:tabular-nums';
      document.body.appendChild(tip);
    }
    return tip;
  }
  function ligarTooltips(root) {
    root.querySelectorAll('[data-tip]').forEach(el => {
      el.addEventListener('mousemove', e => {
        const t = tooltip(); t.textContent = el.getAttribute('data-tip'); t.style.opacity = '1';
        const r = t.getBoundingClientRect();
        t.style.left = Math.min(e.clientX + 14, innerWidth - r.width - 10) + 'px';
        t.style.top = Math.max(e.clientY - r.height - 12, 8) + 'px';
      });
      el.addEventListener('mouseleave', () => { tooltip().style.opacity = '0'; });
    });
    animarConteudo(root);
  }

  /** Entrada suave do bloco recém-inserido (troca de tela ou reaplicação de filtros)
   *  e animação de "desenho" dos gráficos SVG que acabaram de entrar no DOM. */
  function animarConteudo(root) {
    if (!root) return;
    if (root.classList && root.id !== 'modal') {
      root.classList.remove('fx-in');
      void root.offsetWidth;               // força reflow para reiniciar a animação a cada chamada
      root.classList.add('fx-in');
    }
    const barras = root.querySelectorAll('.bar.fx-h, .bar.fx-v');
    if (barras.length) requestAnimationFrame(() => requestAnimationFrame(() => {
      barras.forEach(b => { b.style.transform = ''; });
    }));
    root.querySelectorAll('path.linha-fx').forEach(path => {
      try {
        const len = path.getTotalLength();
        path.style.transition = 'none';
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
        path.getBoundingClientRect();       // força reflow antes de religar a transição
        path.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1)';
        path.style.strokeDashoffset = '0';
      } catch (e) { /* SVG ainda não está no layout (ex.: aba oculta) — ignora */ }
    });
    // rosca (donut): cada fatia "cresce" a partir do zero, em sequência
    root.querySelectorAll('circle.donut-fx').forEach((c, i) => {
      const len = parseFloat(c.dataset.len || '0');
      c.style.transition = 'none';
      c.style.strokeDashoffset = String(len);
      c.getBoundingClientRect();
      c.style.transition = `stroke-dashoffset .8s cubic-bezier(.16,1,.3,1) ${(i * 0.09).toFixed(2)}s`;
      c.style.strokeDashoffset = '0';
    });
  }

  /** Cor estável por categoria (mesmo texto → sempre a mesma cor da paleta institucional,
   *  em qualquer gráfico do sistema). Uso opcional via item.cor. */
  function corCategoria(chave) {
    const s = String(chave || '');
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return CAT[h % CAT.length];
  }

  /** Barras horizontais ranqueadas. items: [{rotulo, valor, sub, tip, destaque, cor}] */
  function barsH(items, o = {}) {
    const fmt = o.fmt || Fmt.money0, lw = o.labelW || 150, bh = 26, gap = 10, pr = 76;
    if (!items.length) return vazio(o.vazio);
    const max = Math.max(...items.map(i => i.valor), 1);
    const h = items.length * (bh + gap);
    const w = 640, bw = w - lw - pr;
    let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${Fmt.esc(o.aria || 'Gráfico de barras')}">`;
    items.forEach((it, i) => {
      const y = i * (bh + gap), L = Math.max(3, (it.valor / max) * bw);
      const cor = it.cor || (it.destaque ? AMBAR : (o.cor || AZUL));
      s += `<text x="0" y="${y + bh / 2 + 4}" style="font-size:11.5px;fill:var(--ink-2)">${Fmt.esc(corta(it.rotulo, 24))}</text>`;
      s += `<rect x="${lw}" y="${y + 4}" width="${bw}" height="${bh - 8}" rx="5" fill="${TRILHO}"/>`;
      const df = it.filtro != null ? ` data-f="${Fmt.esc(it.filtro)}"` : '';
      const estilo = `transform:scaleX(0);color:${cor}` + (it.filtro != null ? ';cursor:pointer' : '');
      s += `<rect class="bar fx-h" x="${lw}" y="${y + 4}" width="${L}" height="${bh - 8}" rx="5" fill="${cor}" style="${estilo}"${df}` +
        ` data-tip="${Fmt.esc(it.tip || (it.rotulo + ': ' + fmt(it.valor)))}"><title>${Fmt.esc(it.rotulo)}</title></rect>`;
      s += `<text x="${w}" y="${y + bh / 2 + 4}" text-anchor="end" class="lbl-v" style="font-size:11.5px">${fmt(it.valor)}</text>`;
    });
    return s + '</svg>';
  }

  /** Colunas verticais. items: [{rotulo, valor, tip, cor}] */
  function barsV(items, o = {}) {
    const fmt = o.fmt || Fmt.num;
    if (!items.length) return vazio(o.vazio);
    const w = 640, h = 230, pb = 40, pt = 24, pl = 8;
    const max = Math.max(...items.map(i => i.valor), 1);
    const cw = (w - pl * 2) / items.length, bw = Math.min(46, cw - 10);
    let s = `<svg class="chart chart-v" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${Fmt.esc(o.aria || 'Gráfico de colunas')}">`;
    for (let g = 0; g <= 3; g++) { const y = pt + (h - pt - pb) * g / 3; s += `<line class="gl" x1="0" x2="${w}" y1="${y}" y2="${y}"/>`; }
    items.forEach((it, i) => {
      const H = Math.max(2, (it.valor / max) * (h - pt - pb));
      const x = pl + i * cw + (cw - bw) / 2, y = h - pb - H;
      const cor = it.cor || o.cor || AZUL;
      const df = it.filtro != null ? ` data-f="${Fmt.esc(it.filtro)}"` : '';
      const estilo = `transform:scaleY(0);color:${cor}` + (it.filtro != null ? ';cursor:pointer' : '');
      s += `<rect class="bar fx-v" x="${x}" y="${y}" width="${bw}" height="${H}" rx="5" fill="${cor}" style="${estilo}"${df}` +
        ` data-tip="${Fmt.esc(it.tip || (it.rotulo + ': ' + fmt(it.valor)))}"/>`;
      s += `<text x="${x + bw / 2}" y="${y - 7}" text-anchor="middle" class="lbl-v" style="font-size:11px">${fmt(it.valor)}</text>`;
      s += `<text x="${x + bw / 2}" y="${h - pb + 17}" text-anchor="middle" style="font-size:11px">${Fmt.esc(corta(it.rotulo, 12))}</text>`;
    });
    return s + '</svg>';
  }

  let areaSeq = 0;
  /** Área + linha para evolução no tempo. pts: [{rotulo, valor, tip}]. o.cor troca a cor da série. */
  function area(pts, o = {}) {
    const fmt = o.fmt || Fmt.money0, cor = o.cor || AZUL;
    if (pts.length < 2) return pts.length ? barsV(pts, o) : vazio(o.vazio);
    const w = 640, h = 240, pl = 8, pr = 8, pt = 22, pb = 36;
    const max = Math.max(...pts.map(p => p.valor), 1);
    const X = i => pl + (w - pl - pr) * (i / (pts.length - 1));
    const Y = v => h - pb - (v / max) * (h - pt - pb);
    const linha = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.valor).toFixed(1)}`).join('');
    const gid = 'gArea' + (++areaSeq);
    let s = `<svg class="chart chart-v" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${Fmt.esc(o.aria || 'Evolução no período')}" style="color:${cor}">`;
    s += `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">` +
      `<stop offset="0%" stop-color="${cor}" stop-opacity=".28"/><stop offset="100%" stop-color="${cor}" stop-opacity="0"/></linearGradient></defs>`;
    for (let g = 0; g <= 3; g++) { const y = pt + (h - pt - pb) * g / 3; s += `<line class="gl" x1="0" x2="${w}" y1="${y}" y2="${y}"/>`; }
    s += `<path class="area-fx" d="${linha}L${X(pts.length - 1)},${h - pb}L${X(0)},${h - pb}Z" fill="url(#${gid})"/>`;
    s += `<path class="linha-fx" d="${linha}" fill="none" stroke="${cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const passo = Math.ceil(pts.length / 8);
    pts.forEach((p, i) => {
      const atraso = (0.5 + Math.min(i, 24) * 0.025).toFixed(3);
      s += `<circle class="dot-fx" style="animation-delay:${atraso}s" cx="${X(i)}" cy="${Y(p.valor)}" r="4" fill="#fff" stroke="${cor}" stroke-width="2"/>`;
      s += `<rect x="${X(i) - (w / pts.length) / 2}" y="${pt}" width="${w / pts.length}" height="${h - pt - pb}" fill="transparent"` +
        ` data-tip="${Fmt.esc(p.tip || (p.rotulo + ': ' + fmt(p.valor)))}"/>`;
      if (i % passo === 0 || i === pts.length - 1)
        s += `<text x="${X(i)}" y="${h - pb + 17}" text-anchor="middle" style="font-size:10.5px">${Fmt.esc(p.rotulo)}</text>`;
    });
    return s + '</svg>';
  }

  let eqSeq = 0;
  /** Colunas finas e brilhantes, estilo "equalizador" — para séries longas ao longo do tempo
   *  (mesma leitura de um gráfico de evolução, com visual mais tecnológico). pts: [{rotulo, valor, tip}]. */
  function equalizador(pts, o = {}) {
    const fmt = o.fmt || Fmt.money0, cor = o.cor || CIANO;
    if (!pts.length) return vazio(o.vazio);
    const w = 640, h = 240, pl = 6, pr = 6, pt = 20, pb = 34;
    const max = Math.max(...pts.map(p => p.valor), 1);
    const n = pts.length;
    const cw = (w - pl - pr) / n;
    const bw = Math.max(2, Math.min(14, cw - 2));
    const gid = 'eqGrad' + (++eqSeq);
    let s = `<svg class="chart chart-v" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${Fmt.esc(o.aria || 'Evolução no período')}" style="color:${cor}">`;
    s += `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">` +
      `<stop offset="0%" stop-color="#8FF2FF"/><stop offset="55%" stop-color="${cor}"/><stop offset="100%" stop-color="#0B50BE"/></linearGradient></defs>`;
    for (let g = 0; g <= 2; g++) { const y = pt + (h - pt - pb) * g / 2; s += `<line class="gl" x1="0" x2="${w}" y1="${y}" y2="${y}"/>`; }
    s += `<line class="gl" x1="0" x2="${w}" y1="${h - pb}" y2="${h - pb}" style="opacity:.6"/>`;
    const passo = Math.max(1, Math.ceil(n / 9));
    pts.forEach((p, i) => {
      const H = Math.max(2, (p.valor / max) * (h - pt - pb));
      const x = pl + i * cw + (cw - bw) / 2, y = h - pb - H;
      const r = Math.min(bw / 2, 4);
      s += `<rect class="bar eq-bar fx-v" x="${x}" y="${y}" width="${bw}" height="${H}" rx="${r}" fill="url(#${gid})" style="transform:scaleY(0)"` +
        ` data-tip="${Fmt.esc(p.tip || (p.rotulo + ': ' + fmt(p.valor)))}"/>`;
      if (i % passo === 0 || i === n - 1)
        s += `<text x="${x + bw / 2}" y="${h - pb + 16}" text-anchor="middle" style="font-size:10px">${Fmt.esc(corta(p.rotulo, 8))}</text>`;
    });
    // marcador pulsante no período mais recente — sensação de "monitoramento ao vivo"
    const last = pts[n - 1];
    const Hl = Math.max(2, (last.valor / max) * (h - pt - pb));
    const xl = pl + (n - 1) * cw + cw / 2, yl = h - pb - Hl;
    s += `<circle class="eq-live" cx="${xl}" cy="${(yl - 9).toFixed(1)}" r="3" fill="${cor}"><title>Período mais recente</title></circle>`;
    return s + '</svg>';
  }

  /** Rosca (donut) de composição — mostra como um total se divide entre categorias.
   *  items: [{rotulo, valor, tip, cor}]. Agrupa o excedente em "Outros" além de o.max (padrão 6). */
  function donut(items, o = {}) {
    items = (items || []).filter(i => i.valor > 0);
    if (!items.length) return vazio(o.vazio);
    const total = items.reduce((s, i) => s + i.valor, 0);
    if (!total) return vazio(o.vazio);
    const fmt = o.fmt || Fmt.money0;
    const MAXN = o.max || 6;
    let itens = items;
    if (items.length > MAXN) {
      const top = items.slice(0, MAXN - 1);
      const outros = items.slice(MAXN - 1).reduce((s, i) => s + i.valor, 0);
      itens = [...top, { rotulo: 'Outros', valor: outros }];
    }
    // cor estável por categoria — "Freios" tem sempre a mesma cor, na rosca e nas barras;
    // "Outros" fica sempre em cinza neutro (não é uma categoria real).
    const corDe = it => it.cor || (it.rotulo === 'Outros' ? '#94A3B8' : corCategoria(it.rotulo));
    const R = 70, CX = 90, CY = 90, SW = 26, C = 2 * Math.PI * R;
    let acc = 0;
    let s = `<svg class="chart donut" viewBox="0 0 180 180" role="img" aria-label="${Fmt.esc(o.aria || 'Gráfico de composição')}">`;
    s += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${TRILHO}" stroke-width="${SW}"/>`;
    itens.forEach(it => {
      const frac = it.valor / total, len = frac * C, cor = corDe(it);
      const rot = -90 + acc * 360;
      s += `<circle class="donut-fx" cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${cor}" stroke-width="${SW}" stroke-linecap="butt"` +
        ` stroke-dasharray="${len.toFixed(2)} ${Math.max(0, C - len).toFixed(2)}" data-len="${len.toFixed(2)}"` +
        ` style="transform:rotate(${rot.toFixed(2)}deg); transform-origin:${CX}px ${CY}px"` +
        ` data-tip="${Fmt.esc(it.tip || (it.rotulo + ': ' + fmt(it.valor) + ' (' + Math.round(frac * 100) + '%)'))}"><title>${Fmt.esc(it.rotulo)}</title></circle>`;
      acc += frac;
    });
    s += `<text x="${CX}" y="${CY - 2}" text-anchor="middle" class="lbl-v" style="font-size:19px;font-weight:800">${fmt(total)}</text>`;
    s += `<text x="${CX}" y="${CY + 16}" text-anchor="middle" style="font-size:10px">${Fmt.esc(o.centro || 'total')}</text>`;
    s += '</svg>';
    const legenda = `<div class="legend">${itens.map(it =>
      `<span><i style="background:${corDe(it)}"></i>${Fmt.esc(corta(it.rotulo, 22))} — ${fmt(it.valor)}</span>`).join('')}</div>`;
    return `<div class="donut-wrap">${s}${legenda}</div>`;
  }

  const corta = (t, n) => { t = String(t || ''); return t.length > n ? t.slice(0, n - 1) + '…' : t; };
  const vazio = m => `<div class="empty"><div class="d"></div><h3>Sem dados no período</h3><p class="dim">${Fmt.esc(m || 'Ajuste os filtros ou registre novas ordens de serviço.')}</p></div>`;
  return { barsH, barsV, area, equalizador, donut, ligarTooltips, corCategoria, corCiano, CAT, AZUL, AMBAR, CIANO };
})();

/* ---------- UI: blocos reutilizáveis ---------- */
const UI = (() => {
  const kpi = (lab, val, sub, alerta) =>
    `<div class="card kpi${alerta ? ' alert' : ''}"><div class="k-lab">${Fmt.esc(lab)}</div>` +
    `<div class="k-val">${val}</div>${sub ? `<div class="k-sub">${sub}</div>` : ''}</div>`;

  const card = (titulo, corpo, acoes, semPad) =>
    `<section class="card">${titulo ? `<div class="card-h"><h2>${Fmt.esc(titulo)}</h2>${acoes || ''}</div>` : ''}` +
    `<div class="${semPad ? '' : 'card-b'}">${corpo}</div></section>`;

  const vazio = (t, m, acao) =>
    `<div class="empty"><div class="d"></div><h3>${Fmt.esc(t)}</h3><p>${Fmt.esc(m)}</p>${acao || ''}</div>`;

  const badgeStatus = s => {
    const m = { 'Concluída': 'b-green', 'Aberta': 'b-blue', 'Em andamento': 'b-amber', 'Cancelada': 'b-red' };
    return `<span class="badge ${m[s] || 'b-gray'}">${Fmt.esc(s)}</span>`;
  };

  function tabela(cols, linhas, o = {}) {
    if (!linhas.length) return vazio(o.vazioT || 'Nada por aqui', o.vazioM || 'Nenhum registro encontrado com os filtros atuais.');
    let s = '<div class="tw"><table><thead><tr>';
    cols.forEach(c => s += `<th class="${c.cls || ''}">${Fmt.esc(c.t)}</th>`);
    s += '</tr></thead><tbody>';
    linhas.forEach(l => {
      s += `<tr class="${l._cls || ''}"${l._attr || ''}>`;
      cols.forEach(c => s += `<td class="${c.cls || ''}">${l[c.k] == null ? '—' : l[c.k]}</td>`);
      s += '</tr>';
    });
    if (o.total) { s += '<tr class="tot-row">'; cols.forEach(c => s += `<td class="${c.cls || ''}">${o.total[c.k] || ''}</td>`); s += '</tr>'; }
    return s + '</tbody></table></div>';
  }

  function modal(titulo, corpo, rodape, largura) {
    fecharModal();
    const bg = document.createElement('div');
    bg.className = 'modal-bg'; bg.id = 'modal';
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${Fmt.esc(titulo)}"${largura ? ` style="max-width:${largura}"` : ''}>
      <div class="modal-h"><h2>${Fmt.esc(titulo)}</h2><div class="spacer"></div>
        <button class="rm-btn" data-fechar aria-label="Fechar">✕</button></div>
      <div class="modal-b">${corpo}</div>
      ${rodape ? `<div class="modal-f">${rodape}</div>` : ''}</div>`;
    bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-fechar]')) fecharModal(); });
    document.body.appendChild(bg);
    Chart.ligarTooltips(bg);
    return bg;
  }
  const fecharModal = () => { const m = document.getElementById('modal'); if (m) m.remove(); };

  function toast(msg, tipo) {
    const c = document.getElementById('toasts');
    const t = document.createElement('div');
    t.className = 'toast ' + (tipo || ''); t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .25s'; setTimeout(() => t.remove(), 260); }, 3200);
  }

  const opcoes = (lista, sel, vazio) =>
    (vazio ? `<option value="">${Fmt.esc(vazio)}</option>` : '') +
    lista.map(v => { const val = v.v !== undefined ? v.v : v, tx = v.t !== undefined ? v.t : v;
      return `<option value="${Fmt.esc(val)}"${String(val) === String(sel) ? ' selected' : ''}>${Fmt.esc(tx)}</option>`; }).join('');

  return { kpi, card, vazio, tabela, modal, fecharModal, toast, opcoes, badgeStatus };
})();

const Auth = {
  /** Retorna null em caso de sucesso, ou a mensagem do que impediu a entrada. */
  entrar(login, senha) {
    const u = DB.usuarioPorLogin(login);
    if (!u || String(u.senha) !== String(senha)) return 'Usuário ou senha incorretos. Verifique e tente novamente.';
    if (u.status !== 'Ativo') return 'Este usuário está inativo. Procure o administrador do sistema.';
    u.ultimoAcesso = Dt.today();
    DB.save();
    Auth.aplicar(u);
    try { sessionStorage.setItem('brilhante_sessao', u.id); } catch (e) { }
    return null;
  },
  aplicar(u) {
    Estado.usuario = {
      id: u.id, nome: u.nome || u.usuario, usuario: u.usuario, perfil: u.perfil,
      permissoes: u.permissoes || Perm.doPerfil(u.perfil), setor: u.setor || ''
    };
  },
  sair() {
    Estado.usuario = null;
    try { sessionStorage.removeItem('brilhante_sessao'); } catch (e) { }
    location.hash = '';
    App.render();
  },
  restaurar() {
    try {
      const id = sessionStorage.getItem('brilhante_sessao');
      const u = id && DB.usuarios().find(x => x.id === id);
      if (u && u.status === 'Ativo') { Auth.aplicar(u); return true; }
    } catch (e) { }
    return false;
  },
  /** Depois de trocar a base (importação de backup), confere se quem está logado continua existindo. */
  revalidar() {
    const at = Estado.usuario; if (!at) return;
    const u = DB.usuarios().find(x => x.id === at.id) || DB.usuarioPorLogin(at.usuario);
    if (u && u.status === 'Ativo') { Auth.aplicar(u); try { sessionStorage.setItem('brilhante_sessao', u.id); } catch (e) { } }
    else { UI.toast('Seu usuário não existe na base importada. Entre novamente.', 'warn'); Auth.sair(); }
  },
  /** Primeira página que este usuário pode abrir. */
  paginaInicial() {
    const ordem = [['dashboard', 'dashboard'], ['os.criar', 'nova-os'], ['os.ver', 'ordens'],
    ['relatorios.ver', 'relatorios'], ['veiculos.ver', 'veiculos'], ['servicos.ver', 'servicos'],
    ['usuarios', 'usuarios'], ['config', 'config']];
    const achou = ordem.find(([perm]) => Perm.pode(perm));
    return achou ? achou[1] : 'sem-acesso';
  }
};

      if (!erro) {
        // Login OK → só então roda a animação de entrada; navegação/render inalterados.
        App.animarEntrada(() => {
          location.hash = '#/' + Auth.paginaInicial(); App.render();

          if (window.Nuvem) Nuvem.sincronizar().then(m => { if (m) App.render(); }).catch(() => { });

        document.getElementById('login-err').innerHTML = `<div class="login-err">${Fmt.esc(erro)}</div>`;
        f.s.value = ''; f.s.focus();

  },

  /** Cortina cinematográfica logo→sistema. Só é chamada após login válido. */
  animarEntrada(cb) {
    let reduz = false;
    try { reduz = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { }
    if (reduz) {                                   // acessibilidade: sem movimento
      cb();
      const flash = document.createElement('div'); flash.id = 'entrada-anim';
      flash.innerHTML = `<div class="ea-stage"><span class="ea-logo">${LOGO_SVG}</span></div>`;
      document.body.appendChild(flash);
      setTimeout(() => { flash.classList.add('ea-out'); setTimeout(() => flash.remove(), 600); }, 500);
      return;
    }
    const parts = Array.from({ length: 16 }, (_, i) => {
      const a = (i / 16) * Math.PI * 2, d = 120 + (i % 3) * 34;
      const x = Math.round(Math.cos(a) * d), y = Math.round(Math.sin(a) * d);
      return `<span class="ea-part" style="--x:${x}px;--y:${y}px;animation-delay:${(0.7 + (i % 5) * 0.11).toFixed(2)}s"></span>`;
    }).join('');
    const ov = document.createElement('div');
    ov.id = 'entrada-anim';
    ov.innerHTML = `<div class="ea-stage"><span class="ea-logo">${LOGO_SVG}</span>${parts}</div>`;
    document.body.appendChild(ov);
    setTimeout(cb, 420);                            // sistema renderiza por baixo da cortina
    setTimeout(() => { ov.classList.add('ea-out'); setTimeout(() => ov.remove(), 640); }, 2680);
  },
};

function optsVeiculos(sel) {

function datalist(id, itens) {

}

/* Rótulos únicos para o campo de veículo — permite digitar nome, placa ou frota. */
const Veic = (() => {
  const chave = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
  function rotulo(v) {
    let r = v.nome;
    if (v.placa && v.placa !== '—') r += ' · ' + v.placa;
    if (v.frota && v.frota !== '—') r += ' · Frota ' + v.frota;
    return r;
  }
  /** [{id, rotulo}] com rótulos garantidamente únicos. */
  function lista() {
    const usados = new Map();
    return DB.get().veiculos
      .slice().sort((a, b) => a.nome.localeCompare(b.nome))
      .map(v => {
        let r = rotulo(v);
        const n = (usados.get(r) || 0) + 1;
        usados.set(r, n);
        if (n > 1) r += ' (' + n + ')';
        return { id: v.id, rotulo: r, v };
      });
  }
  /** Resolve o que foi digitado para um veículo: rótulo, placa, frota ou nome. */
  function resolver(texto) {
    const t = chave(texto);
    if (!t) return null;
    const L = lista();
    let m = L.find(x => chave(x.rotulo) === t);
    if (m) return m.v;
    m = L.find(x => chave(x.v.placa) === t && x.v.placa !== '—');
    if (m) return m.v;
    m = L.find(x => chave(x.v.frota) === t && x.v.frota !== '—');
    if (m) return m.v;
    const parciais = L.filter(x => chave(x.rotulo).includes(t));
    return parciais.length === 1 ? parciais[0].v : null;
  }
  const rotuloDe = id => { const m = lista().find(x => x.id === id); return m ? m.rotulo : ''; };
  const opcoes = () => `<datalist id="dl-veiculos">${lista().map(x =>
    `<option value="${Fmt.esc(x.rotulo)}"></option>`).join('')}</datalist>`;
  return { lista, resolver, rotulo, rotuloDe, opcoes };
})();
/* Catálogo de serviços para digitação livre no lançamento da OS. */
const Serv = (() => {
  const chave = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^a-z0-9]/g, '');
  const ativos = () => DB.get().servicos.filter(s => s.status !== 'Inativo');
  /** Só casa descrição exata (ou escolhida na lista) — não adivinha enquanto digita. */
  function resolver(texto) {
    const t = chave(texto);
    if (!t) return null;
    return ativos().find(s => chave(s.descricao) === t) || null;
  }
  const opcoes = () => `<datalist id="dl-servicos">` +
    ativos().slice().sort((a, b) => a.descricao.localeCompare(b.descricao)).map(s =>
      `<option value="${Fmt.esc(s.descricao)}" label="${Fmt.esc(Fmt.money0(s.valor) + ' · ' + s.categoria)}"></option>`).join('') +
    `</datalist>`;
  return { resolver, opcoes, ativos };
})();

/* ============================================================ NOVA OS */
const Nova = (() => {

  function limpar(base) {

      id: '', numero: DB.proximoNumero(), data: Dt.today(), local: '', condutor: '', veiculoId: '',
      placa: '', frota: '', kmH: null, unidade: 'KM', mecanico: '', setor: 'Mecânica',

    };
    if (!os.itens.length) os.itens.push(linhaVazia());
    // responsáveis (múltiplos) derivados do campo mecanico existente ao editar
    if (!Array.isArray(os.responsaveis))
      os.responsaveis = os.mecanico ? String(os.mecanico).split(',').map(s => s.trim()).filter(Boolean) : [];
    return os;
  }
  const linhaVazia = () => ({ qtd: 1, servicoCod: '', descricao: '', valorUnit: 0, total: 0 });
  const MECANICOS_FIXOS = ['Jefesson', 'Allan', 'Gemerson', 'Vandame', 'Tião', 'Oficina Safra'];

  function pagina(params) {
